# Arquivo de deployment do CloudFormation Git sync.
#
# Ao criar a pilha no console (Create stack -> With Git / Sync from Git), este
# e o arquivo apontado em "Deployment file path". O CloudFormation le daqui o
# caminho do template, os parametros e as tags, e reaplica a pilha a cada push
# nesta branch.
#
# DataBucketName fica de fora de proposito: vazio, o template deriva
# '<ProjectName>-data-<account-id>-<regiao>', que ja e globalmente unico. O
# nome efetivo sai no output DataBucket da pilha. So declare esse parametro
# para reaproveitar um bucket de nome especifico -- e nesse caso valem as
# regras do S3 (3 a 63 caracteres, so minusculas, digitos, ponto e hifen).

template-file-path: template.yaml

parameters:
  ProjectName: iot-telemetry
  MqttTopicFilter: devices/+/telemetry
  RollupLookbackHours: '3'
  HotStoreTtlDays: '45'
  FirehoseBufferSeconds: '300'

tags:
  project: iot-telemetry
  component: ingestao-telemetria
  managed-by: cloudformation-git-sync
