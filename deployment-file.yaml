# Arquivo de deployment do CloudFormation Git sync.
#
# Ao criar a pilha no console (Create stack -> With Git / Sync from Git), este
# e o arquivo apontado em "Deployment file path". O CloudFormation le daqui o
# caminho do template, os parametros e as tags, e reaplica a pilha a cada push
# nesta branch.
#
# ATENCAO: DataBucketName nao tem default no template porque nome de bucket S3
# e globalmente unico. Troque o placeholder abaixo ANTES do primeiro sync.
# Ele e propositalmente invalido (maiusculas) para o template barrar na
# validacao do change set, com mensagem clara, em vez de quebrar no meio do
# create. Regras do S3: 3 a 63 caracteres, so minusculas, digitos, ponto e
# hifen, comecando e terminando com letra ou digito.
# Sugestao: iot-telemetry-data-<account-id>-<regiao>

template-file-path: template.yaml

parameters:
  ProjectName: iot-telemetry
  DataBucketName: TROQUE-POR-UM-NOME-DE-BUCKET-UNICO
  MqttTopicFilter: devices/+/telemetry
  RollupLookbackHours: '3'
  HotStoreTtlDays: '45'
  FirehoseBufferSeconds: '300'

tags:
  project: iot-telemetry
  component: ingestao-telemetria
  managed-by: cloudformation-git-sync
