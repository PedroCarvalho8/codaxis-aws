name: valida template

on:
  push:
  pull_request:

jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install cfn-lint pyyaml boto3

      # Ordem proposital: se o template estiver desatualizado em relacao as
      # fontes, os passos seguintes estariam validando um artefato velho.
      - name: template em dia com as fontes
        run: python3 build/assemble.py --check

      - name: cfn-lint
        run: cfn-lint template.yaml

      - name: sintaxe do python
        run: python3 -m compileall -q glue lambdas

      - name: geohash do Glue Job
        run: python3 tests/test_geohash.py

      - name: handlers da API
        run: python3 tests/test_api_handler.py

      - name: handlers da frota
        run: python3 tests/test_fleet_handlers.py
