      RouteKey: 'GET /devices/{device_id}/metrics/{metric}'
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref RollupApi
      StageName: $default
      AutoDeploy: true
      # A tabela e PAY_PER_REQUEST: sem teto, um cliente em loop vira conta.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
        DetailedMetricsEnabled: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","rota":"$context.routeKey","status":"$context.status","erroIntegracao":"$context.integration.error","ms":"$context.responseLatency"}'

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${ProjectName}'
      RetentionInDays: 14

  # Listagem de dispositivos. Existe porque o frontend precisa descobrir o
  # que consultar; sem o item de catalogo isso seria um Scan.
  CatalogFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-api-catalog'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt QueryFunctionRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref RollupTable
          CORS_ORIGIN: !Ref ApiCorsOrigin
      Code:
        ZipFile: |
          import json
          import os
          from collections import defaultdict

          import boto3
          from boto3.dynamodb.conditions import Key

          TABELA = boto3.resource("dynamodb").Table(os.environ["TABLE"])
          ORIGEM = os.environ["CORS_ORIGIN"]


          def handler(event, context):
              # O Glue Job mantem um item por (device, metrica) sob pk = "CATALOG".
              # Sem ele, listar dispositivos exigiria um Scan da tabela inteira.
              dispositivos = defaultdict(list)
              proxima = None
              while True:
                  extra = {"ExclusiveStartKey": proxima} if proxima else {}
                  pagina = TABELA.query(
                      KeyConditionExpression=Key("pk").eq("CATALOG"), **extra
                  )
                  for item in pagina["Items"]:
                      dispositivos[item["device_id"]].append({
                          "metric": item["metric"],
                          "unit": item.get("unit") or None,
                          "last_seen": item.get("last_seen"),
                      })
                  proxima = pagina.get("LastEvaluatedKey")
                  if not proxima:
                      break

              corpo = {
                  "count": len(dispositivos),
                  "devices": [
                      {
                          "device_id": device,
                          "metrics": sorted(metricas, key=lambda m: m["metric"]),
                      }
                      for device, metricas in sorted(dispositivos.items())
                  ],
              }
              return {
                  "statusCode": 200,
                  "headers": {
                      "content-type": "application/json",
                      "access-control-allow-origin": ORIGEM,
                      "cache-control": "public, max-age=60",
                  },
                  "body": json.dumps(corpo),
              }
  CatalogIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RollupApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CatalogFunction.Arn
      PayloadFormatVersion: '2.0'

  CatalogRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'GET /devices'
      Target: !Sub 'integrations/${CatalogIntegration}'

  CatalogInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CatalogFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RollupApi}/*'

  # Heatmap: celulas de geohash com permanencia por celula.
  HeatmapFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-api-heatmap'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt QueryFunctionRole.Arn
      Timeout: 25
      MemorySize: 512
      Environment:
        Variables:
          TABLE: !Ref RollupTable
          CORS_ORIGIN: !Ref ApiCorsOrigin
      Code:
        ZipFile: |
          import json
          import os

          import boto3
          from boto3.dynamodb.conditions import Key

          TABELA = boto3.resource("dynamodb").Table(os.environ["TABLE"])
          ORIGEM = os.environ["CORS_ORIGIN"]
          TETO = 20000
          DIAS_MAX = 31

          # Tamanho da celula em graus, derivado da precisao: p caracteres = 5p bits,
          # repartidos entre longitude (os impares) e latitude. Vai na resposta para o
          # cliente desenhar o retangulo sem precisar decodificar geohash.
          def tamanho_celula(precisao):
              bits = 5 * precisao
              bits_lon = (bits + 1) // 2
              bits_lat = bits // 2
              return 180.0 / (2 ** bits_lat), 360.0 / (2 ** bits_lon)


          def responde(status, corpo, cache="no-store"):
              return {
                  "statusCode": status,
                  "headers": {
                      "content-type": "application/json",
                      "access-control-allow-origin": ORIGEM,
                      "cache-control": cache,
                  },
                  "body": json.dumps(corpo, default=float),
              }


          def dias_entre(inicio, fim):
              from datetime import date, timedelta
              a = date.fromisoformat(inicio)
              b = date.fromisoformat(fim)
              if b < a:
                  return None
              saida, atual = [], a
              while atual <= b and len(saida) <= DIAS_MAX:
                  saida.append(atual.isoformat())
                  atual += timedelta(days=1)
              return saida


          def handler(event, context):
              caminho = event.get("pathParameters") or {}
              query = event.get("queryStringParameters") or {}
              device = caminho.get("device_id")

              try:
                  dias = dias_entre(query["from"], query["to"])
              except (KeyError, ValueError, TypeError):
                  return responde(400, {"erro": "from e to obrigatorios, em AAAA-MM-DD"})
              if dias is None:
                  return responde(400, {"erro": "to precisa ser maior ou igual a from"})
              if len(dias) > DIAS_MAX:
                  return responde(400, {"erro": f"intervalo maior que {DIAS_MAX} dias"})

              # A celula grossa e a particao da fina: o cliente manda a celula que esta
              # no viewport e recebe so o detalhe dela, em vez do dia inteiro a 5 m.
              celula = query.get("cell")
              precisao = 9 if celula else 7
              prefixo = f"GH{precisao}"

              celulas = {}
              truncado = False
              for dia in dias:
                  pk = f"HEAT#{device}#{dia}" + (f"#{celula}" if celula else "")
                  proxima = None
                  while True:
                      extra = {"ExclusiveStartKey": proxima} if proxima else {}
                      pagina = TABELA.query(
                          KeyConditionExpression=(
                              Key("pk").eq(pk) & Key("sk").begins_with(prefixo + "#")
                          ),
                          **extra,
                      )
                      for item in pagina["Items"]:
                          # Somar entre dias: a mesma celula reaparece a cada passagem.
                          chave = item["gh"]
                          acumulado = celulas.setdefault(
                              chave,
                              {"gh": chave, "lat": item["lat"], "lon": item["lon"],
                               "secs": 0, "dist_m": 0, "n": 0},
                          )
                          acumulado["secs"] += int(item["secs"])
                          acumulado["dist_m"] += float(item["dist_m"])
                          acumulado["n"] += int(item["n"])
                      proxima = pagina.get("LastEvaluatedKey")
                      if not proxima or len(celulas) >= TETO:
                          truncado = truncado or bool(proxima)
                          break

              d_lat, d_lon = tamanho_celula(precisao)
              return responde(
                  200,
                  {
                      "device_id": device,
                      "precision": precisao,
                      "cell": celula,
                      "from": query["from"],
                      "to": query["to"],
                      "cellSize": {"lat": d_lat, "lon": d_lon},
                      "truncated": truncado,
                      "count": len(celulas),
                      "cells": sorted(celulas.values(), key=lambda c: c["gh"]),
                  },
                  "public, max-age=300",
              )

  HeatmapIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RollupApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt HeatmapFunction.Arn
      PayloadFormatVersion: '2.0'

  HeatmapRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'GET /devices/{device_id}/heatmap'
      Target: !Sub 'integrations/${HeatmapIntegration}'

  HeatmapInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HeatmapFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RollupApi}/*'

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref QueryFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RollupApi}/*'

  # ---------------------------------------------------------------------------
  # Gestao de devices - provisionamento no IoT Core via API
  #
  # Uma UNICA policy para toda a frota, com variaveis de politica do IoT:
  # ${iot:Connection.Thing.ThingName} resolve para o thing anexado ao
  # certificado na conexao. O certificado do trator-07 so conecta como
  # trator-07 e so publica nos topicos do trator-07 -- sem uma policy por
  # device para gerenciar, e sem como um device publicar no lugar de outro.
  #
  # Privilegio minimo de verdade: nao ha Subscribe nem Receive. O device desta
  # pilha e um emissor de telemetria; se um dia precisar receber comando, a
  # permissao nasce ai, nao antes.
  # ---------------------------------------------------------------------------

  DevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub '${ProjectName}-device'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}'
            Condition:
              Bool:
                iot:Connection.Thing.IsAttached: ['true']
          - Effect: Allow
            Action: iot:Publish
            Resource:
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/devices/${!iot:Connection.Thing.ThingName}/telemetry'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/devices/${!iot:Connection.Thing.ThingName}/position'
              # Basic ingest: publicar direto no Rules Engine pula o broker e
              # a cobranca de mensageria. O conteudo continua carregando o
              # device_id, e a chave e o certificado continuam por device.
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/rules/${TelemetryTopicRule}'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/rules/${PositionTopicRule}'

  # Leitura da frota: listar e inspecionar devices e certificados.
  AdminReadFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-admin-read'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AdminReadRole.Arn
      Timeout: 15
      MemorySize: 256
      Code:
        ZipFile: |
          import json

          import boto3

          iot = boto3.client("iot")
          # Autenticacao no Lambda authorizer da API, nao aqui: o gateway rejeita
          # antes de invocar, e a logica vive num lugar so.
          _cache = {}


          def resposta(status, corpo):
              return {
                  "statusCode": status,
                  "headers": {"content-type": "application/json",
                              "cache-control": "no-store"},
                  "body": json.dumps(corpo),
              }


          def endpoint_mqtt():
              if "ep" not in _cache:
                  _cache["ep"] = iot.describe_endpoint(
                      endpointType="iot:Data-ATS"
                  )["endpointAddress"]
              return _cache["ep"]


          def certificados_de(nome):
              principais = iot.list_thing_principals(thingName=nome)["principals"]
              saida = []
              for arn in principais:
                  cert_id = arn.split("/")[-1]
                  desc = iot.describe_certificate(
                      certificateId=cert_id
                  )["certificateDescription"]
                  saida.append({
                      "certificate_id": cert_id,
                      "status": desc["status"],
                      "created_at": desc["creationDate"].strftime("%Y-%m-%dT%H:%M:%SZ"),
                  })
              return saida


          def handler(event, context):
              rota = event.get("routeKey", "")
              caminho = event.get("pathParameters") or {}
              consulta = event.get("queryStringParameters") or {}

              if rota == "GET /admin/devices":
                  extra = {}
                  if consulta.get("next"):
                      extra["nextToken"] = consulta["next"]
                  pagina = iot.list_things(maxResults=100, **extra)
                  return resposta(200, {
                      "devices": [t["thingName"] for t in pagina.get("things", [])],
                      "next": pagina.get("nextToken"),
                  })

              if rota == "GET /admin/devices/{device_id}":
                  nome = caminho.get("device_id")
                  try:
                      iot.describe_thing(thingName=nome)
                  except iot.exceptions.ResourceNotFoundException:
                      return resposta(404, {"erro": f"device {nome} nao existe"})
                  return resposta(200, {
                      "device_id": nome,
                      "endpoint": endpoint_mqtt(),
                      "topics": {
                          "telemetry": f"devices/{nome}/telemetry",
                          "position": f"devices/{nome}/position",
                      },
                      "certificates": certificados_de(nome),
                  })

              return resposta(404, {"erro": "rota desconhecida"})

  # Escrita: criar device + certificado, rotacionar, ativar/desativar, revogar.
  AdminWriteFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-admin-write'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AdminWriteRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          DEVICE_POLICY: !Ref DevicePolicy
      Code:
        ZipFile: |
          import json
          import os
          import re

          import boto3

          iot = boto3.client("iot")
          POLICY = os.environ["DEVICE_POLICY"]
          NOME_OK = re.compile(r"^[a-zA-Z0-9_-]{1,128}$")
          # Autenticacao no Lambda authorizer da API, nao aqui: o gateway rejeita
          # antes de invocar, e a logica vive num lugar so.


          def resp(status, corpo):
              return {"statusCode": status,
                      "headers": {"content-type": "application/json",
                                  "cache-control": "no-store"},
                      "body": json.dumps(corpo)}


          def emite(nome):
              # Cria par de chaves ja ativo, anexa a policy da frota e o thing.
              c = iot.create_keys_and_certificate(setAsActive=True)
              iot.attach_policy(policyName=POLICY, target=c["certificateArn"])
              iot.attach_thing_principal(thingName=nome, principal=c["certificateArn"])
              ep = iot.describe_endpoint(endpointType="iot:Data-ATS")["endpointAddress"]
              return {"device_id": nome,
                      "certificate_id": c["certificateId"],
                      # Chave privada devolvida SO aqui; nao e armazenada.
                      "certificate_pem": c["certificatePem"],
                      "private_key": c["keyPair"]["PrivateKey"],
                      "endpoint": ep,
                      "topics": {"telemetry": f"devices/{nome}/telemetry",
                                 "position": f"devices/{nome}/position"}}


          def cert_de(nome, cert_id):
              for arn in iot.list_thing_principals(thingName=nome)["principals"]:
                  if arn.split("/")[-1] == cert_id:
                      return arn
              return None


          def revoga(nome, arn):
              # Desativa antes de tudo: derruba a conexao mesmo se um passo falhar.
              cid = arn.split("/")[-1]
              iot.update_certificate(certificateId=cid, newStatus="INACTIVE")
              iot.detach_policy(policyName=POLICY, target=arn)
              iot.detach_thing_principal(thingName=nome, principal=arn)
              iot.delete_certificate(certificateId=cid)


          def handler(event, context):
              rota = event.get("routeKey", "")
              pp = event.get("pathParameters") or {}
              nome = pp.get("device_id")
              try:
                  corpo = json.loads(event.get("body") or "{}")
              except ValueError:
                  return resp(400, {"erro": "body invalido"})

              try:
                  if rota == "POST /admin/devices":
                      nome = corpo.get("device_id") or ""
                      if not NOME_OK.match(nome):
                          return resp(400, {"erro": "device_id: [a-zA-Z0-9_-]{1,128}"})
                      try:
                          iot.create_thing(thingName=nome)
                      except iot.exceptions.ResourceAlreadyExistsException:
                          return resp(409, {"erro": f"device {nome} ja existe"})
                      return resp(201, emite(nome))

                  if rota == "POST /admin/devices/{device_id}/certificates":
                      iot.describe_thing(thingName=nome)   # 404 se nao existir
                      return resp(201, emite(nome))

                  if rota.startswith("PATCH "):
                      estado = corpo.get("status")
                      if estado not in ("ACTIVE", "INACTIVE"):
                          return resp(400, {"erro": "status: ACTIVE ou INACTIVE"})
                      cid = pp.get("certificate_id")
                      if not cert_de(nome, cid):
                          return resp(404, {"erro": "certificado nao e deste device"})
                      iot.update_certificate(certificateId=cid, newStatus=estado)
                      return resp(200, {"certificate_id": cid, "status": estado})

                  if rota.startswith("DELETE ") and "{certificate_id}" in rota:
                      arn = cert_de(nome, pp.get("certificate_id"))
                      if not arn:
                          return resp(404, {"erro": "certificado nao e deste device"})
                      revoga(nome, arn)
                      return resp(200, {"revoked": pp.get("certificate_id")})

                  if rota == "DELETE /admin/devices/{device_id}":
                      arns = iot.list_thing_principals(thingName=nome)["principals"]
                      for arn in arns:
                          revoga(nome, arn)
                      iot.delete_thing(thingName=nome)
                      return resp(200, {"deleted": nome, "certificates": len(arns)})
              except iot.exceptions.ResourceNotFoundException:
                  return resp(404, {"erro": f"device {nome} nao existe"})

              return resp(404, {"erro": "rota desconhecida"})

  # A chave de admin vive num SecureString do Parameter Store, criado fora da
  # pilha -- nem em parametro do CloudFormation nem no deployment file, porque
  # este repositorio e publico e o Git sync leria a chave dali.
  AdminKeyReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/admin/api-key'
          - Effect: Allow
            Action: kms:Decrypt
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  AdminReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: le-frota
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iot:ListThings
                  - iot:DescribeEndpoint
                Resource: '*'
              - Effect: Allow
                Action:
                  - iot:DescribeThing
                  - iot:ListThingPrincipals
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/*'
              - Effect: Allow
                Action: iot:DescribeCertificate
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:cert/*'

  AdminWriteRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: provisiona-frota
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CreateKeysAndCertificate e DescribeEndpoint nao aceitam
              # escopo de recurso.
              - Effect: Allow
                Action:
                  - iot:CreateKeysAndCertificate
                  - iot:DescribeEndpoint
                Resource: '*'
              - Effect: Allow
                Action:
                  - iot:CreateThing
                  - iot:DescribeThing
                  - iot:DeleteThing
                  - iot:AttachThingPrincipal
                  - iot:DetachThingPrincipal
                  - iot:ListThingPrincipals
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/*'
              - Effect: Allow
                Action:
                  - iot:DescribeCertificate
                  - iot:UpdateCertificate
                  - iot:DeleteCertificate
                  - iot:AttachPolicy
                  - iot:DetachPolicy
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:cert/*'
              # AttachPolicy/DetachPolicy validam tambem a policy alvo.
              - Effect: Allow
                Action:
                  - iot:AttachPolicy
                  - iot:DetachPolicy
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:policy/${DevicePolicy}'

  # A chave de admin e comparada AQUI, no gateway, antes de qualquer Lambda
  # de negocio ser invocada. Header x-api-key contra o SecureString do SSM.
  AdminAuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-admin-authorizer'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AdminAuthorizerRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          ADMIN_KEY_PARAM: !Sub '/${ProjectName}/admin/api-key'
      Code:
        ZipFile: |
          import hmac
          import os

          import boto3

          ssm = boto3.client("ssm")
          PARAM = os.environ["ADMIN_KEY_PARAM"]
          _cache = {}


          def chave():
              if "v" not in _cache:
                  try:
                      _cache["v"] = ssm.get_parameter(Name=PARAM, WithDecryption=True)[
                          "Parameter"]["Value"]
                  except ssm.exceptions.ParameterNotFound:
                      # Sem o parametro no SSM, a API de gestao fica DESLIGADA --
                      # nunca aberta por omissao.
                      _cache["v"] = None
              return _cache["v"]


          def handler(event, context):
              dado = (event.get("headers") or {}).get("x-api-key") or ""
              alvo = chave()
              if alvo and hmac.compare_digest(dado, alvo):
                  return {"isAuthorized": True}
              # Recarrega uma vez: cobre rotacao da chave sem redeploy.
              _cache.pop("v", None)
              alvo = chave()
              return {"isAuthorized": bool(alvo) and hmac.compare_digest(dado, alvo)}

  AdminAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !Ref AdminKeyReadPolicy

  AdminAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref RollupApi
      Name: !Sub '${ProjectName}-admin-key'
      AuthorizerType: REQUEST
      AuthorizerPayloadFormatVersion: '2.0'
      EnableSimpleResponses: true
      AuthorizerUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminAuthorizerFunction.Arn}/invocations'
      IdentitySource:
        - '$request.header.x-api-key'
      # Cache por valor de chave: rotacao demora ate isto para valer no
      # gateway; o proprio authorizer ja recarrega o SSM a cada erro.
      AuthorizerResultTtlInSeconds: 60

  AdminAuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminAuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RollupApi}/*'

  AdminReadIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RollupApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AdminReadFunction.Arn
      PayloadFormatVersion: '2.0'

  AdminWriteIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RollupApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AdminWriteFunction.Arn
      PayloadFormatVersion: '2.0'

  AdminListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'GET /admin/devices'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizer
      Target: !Sub 'integrations/${AdminReadIntegration}'

  AdminDetailRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'GET /admin/devices/{device_id}'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizer
      Target: !Sub 'integrations/${AdminReadIntegration}'

  AdminCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'POST /admin/devices'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizer
      Target: !Sub 'integrations/${AdminWriteIntegration}'

  AdminRotateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'POST /admin/devices/{device_id}/certificates'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizer
      Target: !Sub 'integrations/${AdminWriteIntegration}'

  AdminCertStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'PATCH /admin/devices/{device_id}/certificates/{certificate_id}'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizer
      Target: !Sub 'integrations/${AdminWriteIntegration}'

  AdminRevokeCertRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'DELETE /admin/devices/{device_id}/certificates/{certificate_id}'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizer
      Target: !Sub 'integrations/${AdminWriteIntegration}'

  AdminDeleteDeviceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'DELETE /admin/devices/{device_id}'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizer
      Target: !Sub 'integrations/${AdminWriteIntegration}'

  AdminReadInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminReadFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RollupApi}/*'

  AdminWriteInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminWriteFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RollupApi}/*'

Outputs:

  IoTRuleName:
    Description: >
      Nome da regra. Para basic ingest, publique em
      $aws/rules/<este-nome> e pule a cobranca de mensageria do broker.
    Value: !Ref TelemetryTopicRule

  PositionRuleName:
    Description: >
      Regra de posicao. Para basic ingest, o trator publica em
      $aws/rules/<este-nome>.
    Value: !Ref PositionTopicRule

  DeliveryStreamName:
    Value: !Ref TelemetryDeliveryStream

  RawTable:
    Description: Tabela Iceberg com o dado bruto.
    Value: !Sub '${GlueDatabase}.telemetry_raw'

  RollupTableName:
    Description: Tabela DynamoDB consultada pelo frontend.
    Value: !Ref RollupTable

  DataBucket:
    Value: !Ref DataBucket

  ApiEndpoint:
    Description: Base da API de leitura consumida pelo frontend.
    Value: !GetAtt RollupApi.ApiEndpoint

  ApiExemplo:
    Description: Chamada de exemplo (ajuste device, metrica e o intervalo).
    Value: !Sub >-
      ${RollupApi.ApiEndpoint}/devices/sensor-teste/metrics/temperature?from=2026-08-26T00:00:00Z&to=2026-08-27T00:00:00Z
