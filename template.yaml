  LocationsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-argus-locations'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DevicesReadRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref RollupTable
      Code:
        ZipFile: |
          import json
          import os
          from datetime import datetime, timezone
          from http.client import responses

          import boto3
          from boto3.dynamodb.conditions import Key

          TABELA = boto3.resource("dynamodb").Table(os.environ["TABLE"])
          LIMITE_MAX = 500


          def resp(status, corpo):
              return {"statusCode": status,
                      "headers": {"content-type": "application/json",
                                  "cache-control": "no-store"},
                      "body": json.dumps(corpo)}


          def erro(status, mensagem, caminho, campos=None):
              """Erro no formato ApiError da spec (openapi/openapi.yaml)."""
              return resp(status, {
                  "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "status": status, "error": responses.get(status, "Error"),
                  "message": mensagem, "path": caminho, "fields": campos or {}})


          def molda(codigo, item):
              """Item TRACK/LATEST -> LocationResponse do contrato argus."""
              ts = item.get("ts") or item.get("at")
              return {
                  # id numerico que o contrato pede; epoch ms do fix e unico o
                  # bastante por device e estavel entre paginas.
                  "id": int(datetime.strptime(ts, "%Y-%m-%dT%H:%M:%SZ")
                            .replace(tzinfo=timezone.utc).timestamp() * 1000),
                  "deviceCode": codigo,
                  "ts": ts,
                  "lat": float(item["lat"]),
                  "lon": float(item["lon"]),
                  # Ingestao registra km/h (contrato MQTT); o argus espera m/s.
                  "speedMps": (round(float(item["speed"]) / 3.6, 3)
                               if item.get("speed") is not None else None),
                  "courseDeg": (float(item["heading"])
                                if item.get("heading") is not None else None),
                  "sats": None,
                  "hdop": None,
                  "receivedAt": item.get("received_at") or ts,
              }


          def handler(event, context):
              rota = event.get("routeKey", "")
              caminho_url = event.get("rawPath", rota)
              q = event.get("queryStringParameters") or {}

              if rota == "GET /v1/locations/latest":
                  # DEVICEMETA lista a frota; um GetItem por device pega o LATEST que a
                  # ingestao mantem. Custo acompanha o tamanho da frota.
                  frota = TABELA.query(
                      KeyConditionExpression=Key("pk").eq("DEVICEMETA")
                  )["Items"]
                  saida = []
                  for meta in frota:
                      r = TABELA.get_item(
                          Key={"pk": f"DEV#{meta['sk']}#position", "sk": "LATEST"}
                      )
                      if "Item" in r:
                          saida.append(molda(meta["sk"], r["Item"]))
                  return resp(200, saida)

              if rota == "GET /v1/devices/{code}/locations":
                  codigo = (event.get("pathParameters") or {}).get("code")
                  if "Item" not in TABELA.get_item(
                          Key={"pk": "DEVICEMETA", "sk": codigo}):
                      return erro(404, f"device {codigo} nao existe", caminho_url)
                  limite = min(int(q.get("limit") or 100), LIMITE_MAX)
                  cond = Key("pk").eq(f"TRACK#{codigo}")
                  de, ate = q.get("from"), q.get("to")
                  # `to` e EXCLUSIVO: e o cursor da paginacao keyset, entao a linha do
                  # cursor nao pode reaparecer na pagina seguinte. between e inclusivo,
                  # dai o filtro apos a Query quando from e to vem juntos.
                  if de and ate:
                      cond &= Key("sk").between(de, ate)
                  elif ate:
                      cond &= Key("sk").lt(ate)
                  elif de:
                      cond &= Key("sk").gte(de)
                  pagina = TABELA.query(
                      KeyConditionExpression=cond,
                      ScanIndexForward=False,       # mais recente primeiro
                      Limit=limite,
                  )
                  linhas = [i for i in pagina["Items"] if not ate or i["sk"] < ate]
                  itens = [molda(codigo, i) for i in linhas]
                  # Keyset: o proximo pedido repassa o cursor no parametro `to`.
                  cursor = (linhas[-1]["sk"]
                            if linhas and pagina.get("LastEvaluatedKey") else None)
                  return resp(200, {"items": itens, "nextCursor": cursor})

              return erro(404, "rota desconhecida", caminho_url)

  UsersFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-argus-users'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt UsersRole.Arn
      Timeout: 20
      MemorySize: 256
      Environment:
        Variables:
          USER_POOL: !Ref UserPool
      Code:
        ZipFile: |
          import json
          from datetime import datetime, timezone
          from http.client import responses
          import os

          import boto3

          idp = boto3.client("cognito-idp")
          POOL = os.environ["USER_POOL"]
          PAPEIS = ("ADMIN", "OPERATOR", "VIEWER")


          def resp(status, corpo):
              return {"statusCode": status,
                      "headers": {"content-type": "application/json",
                                  "cache-control": "no-store"},
                      "body": json.dumps(corpo)}


          def erro(status, mensagem, caminho, campos=None):
              """Erro no formato ApiError da spec (openapi/openapi.yaml)."""
              return resp(status, {
                  "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "status": status, "error": responses.get(status, "Error"),
                  "message": mensagem, "path": caminho, "fields": campos or {}})


          def papel_de(claims):
              return (claims or {}).get("role") or "VIEWER"


          def atributos(usuario):
              return {a["Name"]: a["Value"] for a in usuario.get("Attributes")
                      or usuario.get("UserAttributes") or []}


          def molda(usuario, papel):
              at = atributos(usuario)
              return {
                  "id": at.get("sub") or usuario["Username"],
                  "email": at.get("email") or usuario["Username"],
                  "name": at.get("name") or "",
                  "role": papel,
                  "createdAt": usuario["UserCreateDate"].strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "disabledAt": None if usuario.get("Enabled", True) else "",
              }


          def handler(event, context):
              claims = (event.get("requestContext", {}).get("authorizer", {})
                        .get("jwt", {}).get("claims", {}))
              # So ADMIN gere usuarios -- mesmo criterio que o webapp usa para exibir a
              # tela, mas imposto aqui, onde vale.
              if papel_de(claims) != "ADMIN":
                  return erro(403, "apenas ADMIN gere usuarios",
                              event.get("rawPath", ""))

              rota = event.get("routeKey", "")
              caminho_url = event.get("rawPath", rota)
              try:
                  corpo = json.loads(event.get("body") or "{}")
              except ValueError:
                  return erro(400, "body invalido", caminho_url)

              if rota == "GET /v1/users":
                  saida = []
                  for u in idp.list_users(UserPoolId=POOL, Limit=60)["Users"]:
                      grupos = idp.admin_list_groups_for_user(
                          UserPoolId=POOL, Username=u["Username"]
                      )["Groups"]
                      nomes = [g["GroupName"] for g in grupos]
                      papel = next((p for p in PAPEIS if p in nomes), "VIEWER")
                      saida.append(molda(u, papel))
                  return resp(200, saida)

              if rota == "POST /v1/users":
                  email = corpo.get("email") or ""
                  senha = corpo.get("password") or ""
                  nome = (corpo.get("name") or "").strip()
                  papel = corpo.get("role") or "VIEWER"
                  if not email or not senha or not nome:
                      return erro(400, "email, password e name obrigatorios", caminho_url)
                  if papel not in PAPEIS:
                      return erro(400, f"role: {'|'.join(PAPEIS)}", caminho_url,
                                  {"role": "|".join(PAPEIS)})
                  try:
                      idp.admin_create_user(
                          UserPoolId=POOL, Username=email, MessageAction="SUPPRESS",
                          UserAttributes=[
                              {"Name": "email", "Value": email},
                              {"Name": "email_verified", "Value": "true"},
                              {"Name": "name", "Value": nome},
                          ],
                      )
                  except idp.exceptions.UsernameExistsException:
                      return erro(409, f"{email} ja existe", caminho_url)
                  idp.admin_set_user_password(
                      UserPoolId=POOL, Username=email, Password=senha, Permanent=True
                  )
                  idp.admin_add_user_to_group(
                      UserPoolId=POOL, Username=email, GroupName=papel
                  )
                  u = idp.admin_get_user(UserPoolId=POOL, Username=email)
                  return resp(201, molda(u, papel))

              return erro(404, "rota desconhecida", caminho_url)

