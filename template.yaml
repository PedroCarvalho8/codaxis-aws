AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Pipeline de ingestao IoT: IoT Core (MQTT) -> Amazon Data Firehose ->
  tabela Apache Iceberg no Glue Data Catalog -> Glue Job de agregacao ->
  DynamoDB (rollups servidos ao frontend).

# ATENCAO: arquivo GERADO por build/assemble.py -- nao edite aqui.
# As fontes estao em infra/ (fragmentos YAML), lambdas/, glue/ e frontend/.
# Depois de mexer em qualquer uma delas, rode: make build

Parameters:

  ProjectName:
    Type: String
    Default: iot-telemetry
    AllowedPattern: '[a-z0-9-]+'
    Description: Prefixo usado no nome dos recursos.

  DataBucketName:
    Type: String
    Default: ''
    MaxLength: 63
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: >
      Vazio, ou um nome de bucket S3 valido: 3 a 63 caracteres, apenas
      minusculas, digitos, ponto e hifen, comecando e terminando com letra ou
      digito. Maiuscula e underscore sao rejeitados pelo S3.
    Description: >
      Nome do bucket S3 criado por esta pilha (warehouse Iceberg, erros do
      Firehose e script do Glue Job). Deixe vazio para a pilha derivar
      '<ProjectName>-data-<account-id>-<regiao>', que ja e globalmente unico.
      Preencha apenas para reaproveitar um nome especifico.

  MqttTopicFilter:
    Type: String
    Default: 'devices/+/telemetry'
    Description: >
      Filtro de topico da regra do IoT Core. Para basic ingest, o device
      publica em $aws/rules/<RuleName> e este filtro passa a ser ignorado.

  PositionTopicFilter:
    Type: String
    Default: 'devices/+/position'
    Description: >
      Filtro de topico da regra de posicao. Caminho separado do de telemetria
      porque o formato do registro e outro.

  PositionSampleSeconds:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 300
    Description: >
      Intervalo nominal entre fixes de GPS. Usado como teto do dt na conta de
      permanencia: sem ele, um trator desligado a noite doaria horas para a
      celula onde estacionou.

  RollupLookbackHours:
    Type: Number
    Default: 3
    Description: >
      Janela retroativa reprocessada a cada execucao do Glue Job. Cobre
      chegada tardia de dados (device offline que sobe batch acumulado).

  HotStoreTtlDays:
    Type: Number
    Default: 45
    Description: Retencao dos rollups no DynamoDB antes do TTL expirar o item.

  ApiCorsOrigin:
    Type: String
    Default: '*'
    Description: >
      Origem aceita pelo CORS da API de leitura. '*' serve para teste; em
      producao aponte para o dominio do frontend.

  FirehoseBufferSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 900
    Description: Intervalo de buffer do Firehose antes de escrever no Iceberg.

Conditions:

  # Nome de bucket e globalmente unico; account id + regiao resolvem isso sem
  # exigir que quem faz o deploy invente um nome.
  DerivarNomeDoBucket: !Equals [!Ref DataBucketName, '']

Resources:

  # ---------------------------------------------------------------------------
  # Armazenamento
  # ---------------------------------------------------------------------------

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - DerivarNomeDoBucket
        - !Sub '${ProjectName}-data-${AWS::AccountId}-${AWS::Region}'
        - !Ref DataBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expira-erros-do-firehose
            Status: Enabled
            Prefix: errors/
            ExpirationInDays: 30
          - Id: aborta-multipart-incompleto
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # ---------------------------------------------------------------------------
  # Glue Data Catalog - database e tabela Iceberg (dado bruto)
  # ---------------------------------------------------------------------------

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        # Hifen fora: o Firehose exige [a-zA-Z0-9._]+ em
        # destinationDatabaseName, entao 'iot-telemetry_db' quebraria a
        # criacao do delivery stream. Mesmo tratamento dado ao nome da regra
        # do IoT Core mais abaixo.
        Name: !Sub
          - '${Name}_db'
          - Name: !Join ['_', !Split ['-', !Ref ProjectName]]
        Description: Telemetria de dispositivos IoT.

  TelemetryRawTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      OpenTableFormatInput:
        IcebergInput:
          MetadataOperation: CREATE
          Version: '2'
      TableInput:
        Name: telemetry_raw
        TableType: EXTERNAL_TABLE
        # table_type e metadata_location sao reservados: o IcebergInput acima
        # os define, e o Glue rejeita a criacao se vierem declarados aqui.
        Parameters:
          format: parquet
          write.parquet.compression-codec: zstd
        StorageDescriptor:
          Location: !Sub 's3://${DataBucket}/warehouse/telemetry_raw/'
          Columns:
            - Name: device_id
              Type: string
              Comment: Identificador do dispositivo (enviado dentro de cada leitura).
            - Name: event_time
              Type: timestamp
              Comment: Momento da medicao no device (ISO-8601 UTC).
            - Name: ingested_at
              Type: timestamp
              Comment: Momento em que o Firehose recebeu o registro.
            - Name: metric
              Type: string
              Comment: Nome da grandeza medida (ex. temperature, humidity).
            - Name: value
              Type: double
            - Name: unit
              Type: string
            - Name: batch_id
              Type: string
              Comment: Id do lote enviado pelo device, usado para deduplicacao.
            - Name: seq
              Type: int
              Comment: Sequencia da leitura dentro do lote.

  # Compaction + expiracao de snapshots gerenciadas pelo Glue.
  # Sem isso, entregas de 5 em 5 minutos viram milhares de arquivos pequenos.
  TelemetryCompaction:
    Type: AWS::Glue::TableOptimizer
    DependsOn: TelemetryRawTable
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableName: telemetry_raw
      Type: compaction
      TableOptimizerConfiguration:
        Enabled: true
        RoleArn: !GetAtt TableOptimizerRole.Arn

  TelemetrySnapshotRetention:
    Type: AWS::Glue::TableOptimizer
    DependsOn: TelemetryCompaction
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableName: telemetry_raw
      Type: retention
      TableOptimizerConfiguration:
        Enabled: true
        RoleArn: !GetAtt TableOptimizerRole.Arn
        RetentionConfiguration:
          IcebergConfiguration:
            SnapshotRetentionPeriodInDays: 7
            NumberOfSnapshotsToRetain: 10
            CleanExpiredFiles: true

  TableOptimizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: otimiza-tabela-iceberg
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - glue:GetTable
                  - glue:UpdateTable
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabase}'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabase}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*'

  # ---------------------------------------------------------------------------
  # Posicao dos tratores - tabela Iceberg propria
  #
  # Nao entra em telemetry_raw porque o formato e outro: uma leitura escalar
  # tem (metric, value); uma posicao e um par (lat, lon) que so significa
  # alguma coisa junto. Separar em duas metricas destruiria o pareamento, e com
  # ele distancia, velocidade e o proprio ponto no mapa.
  # ---------------------------------------------------------------------------

  PositionsRawTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      OpenTableFormatInput:
        IcebergInput:
          MetadataOperation: CREATE
          Version: '2'
      TableInput:
        Name: positions_raw
        TableType: EXTERNAL_TABLE
        Parameters:
          format: parquet
          write.parquet.compression-codec: zstd
        StorageDescriptor:
          Location: !Sub 's3://${DataBucket}/warehouse/positions_raw/'
          Columns:
            - Name: device_id
              Type: string
            - Name: event_time
              Type: timestamp
              Comment: Momento do fix de GPS no device (ISO-8601 UTC).
            - Name: ingested_at
              Type: timestamp
            - Name: lat
              Type: double
            - Name: lon
              Type: double
            - Name: speed
              Type: double
              Comment: Opcional. O job deriva velocidade de distancia/tempo.
            - Name: heading
              Type: double
            - Name: altitude
              Type: double
            - Name: batch_id
              Type: string
            - Name: seq
              Type: int
              Comment: Unico no lote inteiro, nao por campo.

  PositionsCompaction:
    Type: AWS::Glue::TableOptimizer
    DependsOn: PositionsRawTable
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableName: positions_raw
      Type: compaction
      TableOptimizerConfiguration:
        Enabled: true
        RoleArn: !GetAtt TableOptimizerRole.Arn

  PositionsSnapshotRetention:
    Type: AWS::Glue::TableOptimizer
    DependsOn: PositionsCompaction
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableName: positions_raw
      Type: retention
      TableOptimizerConfiguration:
        Enabled: true
        RoleArn: !GetAtt TableOptimizerRole.Arn
        RetentionConfiguration:
          IcebergConfiguration:
            SnapshotRetentionPeriodInDays: 7
            NumberOfSnapshotsToRetain: 10
            CleanExpiredFiles: true

  # ---------------------------------------------------------------------------
  # Lambda de transformacao do Firehose
  # Recebe UMA leitura por invocacao (o batchMode da regra IoT ja separou o
  # array) e carimba o horario de ingestao. Transformacao no Firehose e 1:1 -
  # nao da para explodir um registro em varios aqui, por isso o fan-out do
  # lote acontece na regra do IoT Core.
  # ---------------------------------------------------------------------------

  TransformFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-firehose-transform'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TransformFunctionRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        ZipFile: |
          import base64
          import json
          from datetime import datetime, timezone

          REQUIRED = ("device_id", "event_time", "metric", "value")

          def handler(event, context):
              now = datetime.now(timezone.utc).isoformat(timespec="milliseconds")
              out = []
              for rec in event["records"]:
                  try:
                      payload = json.loads(base64.b64decode(rec["data"]))
                      if any(payload.get(f) is None for f in REQUIRED):
                          out.append({"recordId": rec["recordId"],
                                      "result": "ProcessingFailed"})
                          continue
                      payload["ingested_at"] = now
                      payload["value"] = float(payload["value"])
                      if payload.get("seq") is not None:
                          payload["seq"] = int(payload["seq"])
                      data = base64.b64encode(
                          json.dumps(payload).encode("utf-8")
                      ).decode("utf-8")
                      out.append({"recordId": rec["recordId"],
                                  "result": "Ok",
                                  "data": data})
                  except Exception:
                      out.append({"recordId": rec["recordId"],
                                  "result": "ProcessingFailed"})
              return {"records": out}
  TransformFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  # ---------------------------------------------------------------------------
  # Amazon Data Firehose -> Iceberg
  # ---------------------------------------------------------------------------

  FirehoseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/kinesisfirehose/${ProjectName}'
      RetentionInDays: 14

  FirehoseLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref FirehoseLogGroup
      LogStreamName: iceberg-delivery

  TelemetryDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    DependsOn: TelemetryRawTable
    Properties:
      DeliveryStreamName: !Sub '${ProjectName}-to-iceberg'
      DeliveryStreamType: DirectPut
      IcebergDestinationConfiguration:
        RoleARN: !GetAtt FirehoseRole.Arn
        # Telemetria e insert-only. AppendOnly=true libera o Firehose a
        # escalar o throughput automaticamente.
        AppendOnly: true
        CatalogConfiguration:
          CatalogArn: !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
        DestinationTableConfigurationList:
          - DestinationDatabaseName: !Ref GlueDatabase
            DestinationTableName: telemetry_raw
        BufferingHints:
          IntervalInSeconds: !Ref FirehoseBufferSeconds
          SizeInMBs: 128
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Lambda
              Parameters:
                - ParameterName: LambdaArn
                  ParameterValue: !GetAtt TransformFunction.Arn
                - ParameterName: BufferIntervalInSeconds
                  ParameterValue: '60'
                - ParameterName: BufferSizeInMBs
                  ParameterValue: '3'
        RetryOptions:
          DurationInSeconds: 300
        s3BackupMode: FailedDataOnly
        S3Configuration:
          RoleARN: !GetAtt FirehoseRole.Arn
          BucketARN: !GetAtt DataBucket.Arn
          Prefix: 'errors/'
          ErrorOutputPrefix: 'errors/!{firehose:error-output-type}/'
          BufferingHints:
            IntervalInSeconds: 300
            SizeInMBs: 5
          CompressionFormat: GZIP
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseLogGroup
          LogStreamName: !Ref FirehoseLogStream

  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref AWS::AccountId
      Policies:
        - PolicyName: entrega-iceberg
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - glue:GetTable
                  - glue:GetDatabase
                  - glue:UpdateTable
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabase}'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabase}/*'
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:GetFunctionConfiguration
                Resource:
                  - !GetAtt TransformFunction.Arn
                  - !GetAtt PositionTransformFunction.Arn
              - Effect: Allow
                Action: logs:PutLogEvents
                Resource:
                  - !GetAtt FirehoseLogGroup.Arn
                  - !GetAtt PositionLogGroup.Arn

  # ---------------------------------------------------------------------------
  # Caminho de ingestao das posicoes - paralelo ao da telemetria
  #
  # Stream separado de proposito: o caminho da telemetria ja esta em producao e
  # nao precisa ser tocado para a posicao existir. Delivery stream parado nao
  # custa (cobranca por GB), entao o paralelismo sai de graca.
  # ---------------------------------------------------------------------------

  PositionTransformFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-position-transform'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TransformFunctionRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        ZipFile: |
          import base64
          import json
          from datetime import datetime, timezone

          # lat/lon sao obrigatorios e precisam vir PAREADOS na mesma leitura: distancia,
          # velocidade e a propria celula do mapa dependem do par, e nenhum deles se
          # reconstroi se os dois virarem registros separados.
          REQUIRED = ("device_id", "event_time", "lat", "lon")
          OPCIONAIS_FLOAT = ("speed", "heading", "altitude")


          def handler(event, context):
              now = datetime.now(timezone.utc).isoformat(timespec="milliseconds")
              out = []
              for rec in event["records"]:
                  try:
                      payload = json.loads(base64.b64decode(rec["data"]))
                      if any(payload.get(f) is None for f in REQUIRED):
                          out.append({"recordId": rec["recordId"],
                                      "result": "ProcessingFailed"})
                          continue
                      lat = float(payload["lat"])
                      lon = float(payload["lon"])
                      if not (-90.0 <= lat <= 90.0 and -180.0 <= lon <= 180.0):
                          # Coordenada fora do globo costuma ser fix de GPS invalido
                          # (0,0 e o classico). Deixar entrar sujaria o heatmap com uma
                          # celula no golfo da Guine.
                          out.append({"recordId": rec["recordId"],
                                      "result": "ProcessingFailed"})
                          continue
                      payload["lat"] = lat
                      payload["lon"] = lon
                      payload["ingested_at"] = now
                      for campo in OPCIONAIS_FLOAT:
                          if payload.get(campo) is not None:
                              payload[campo] = float(payload[campo])
                      if payload.get("seq") is not None:
                          payload["seq"] = int(payload["seq"])
                      data = base64.b64encode(
                          json.dumps(payload).encode("utf-8")
                      ).decode("utf-8")
                      out.append({"recordId": rec["recordId"],
                                  "result": "Ok",
                                  "data": data})
                  except Exception:
                      out.append({"recordId": rec["recordId"],
                                  "result": "ProcessingFailed"})
              return {"records": out}

  PositionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/kinesisfirehose/${ProjectName}-positions'
      RetentionInDays: 14

  PositionLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref PositionLogGroup
      LogStreamName: iceberg-delivery

  PositionDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    DependsOn: PositionsRawTable
    Properties:
      DeliveryStreamName: !Sub '${ProjectName}-positions-to-iceberg'
      DeliveryStreamType: DirectPut
      IcebergDestinationConfiguration:
        RoleARN: !GetAtt FirehoseRole.Arn
        AppendOnly: true
        CatalogConfiguration:
          CatalogArn: !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
        DestinationTableConfigurationList:
          - DestinationDatabaseName: !Ref GlueDatabase
            DestinationTableName: positions_raw
        BufferingHints:
          IntervalInSeconds: !Ref FirehoseBufferSeconds
          SizeInMBs: 128
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Lambda
              Parameters:
                - ParameterName: LambdaArn
                  ParameterValue: !GetAtt PositionTransformFunction.Arn
                - ParameterName: BufferIntervalInSeconds
                  ParameterValue: '60'
                - ParameterName: BufferSizeInMBs
                  ParameterValue: '3'
        RetryOptions:
          DurationInSeconds: 300
        s3BackupMode: FailedDataOnly
        S3Configuration:
          RoleARN: !GetAtt FirehoseRole.Arn
          BucketARN: !GetAtt DataBucket.Arn
          Prefix: 'errors/'
          ErrorOutputPrefix: 'errors/!{firehose:error-output-type}/'
          BufferingHints:
            IntervalInSeconds: 300
            SizeInMBs: 5
          CompressionFormat: GZIP
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref PositionLogGroup
          LogStreamName: !Ref PositionLogStream

  # ---------------------------------------------------------------------------
  # IoT Core - regra que joga a telemetria no Firehose
  #
  # Contrato do payload publicado pelo device:
  #   { "readings": [
  #       {"device_id":"abc","event_time":"2026-08-26T14:00:00Z",
  #        "metric":"temperature","value":23.4,"unit":"C",
  #        "batch_id":"b-778","seq":0}, ... ] }
  #
  # SELECT VALUE readings + BatchMode: true faz cada elemento do array virar
  # um registro no PutRecordBatch (teto de 500 por chamada). Por isso cada
  # leitura precisa carregar o proprio device_id: depois do fan-out a
  # informacao do topico nao existe mais.
  # ---------------------------------------------------------------------------

  TelemetryTopicRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub
        - '${Name}_telemetry'
        - Name: !Join ['_', !Split ['-', !Ref ProjectName]]
      TopicRulePayload:
        Description: Encaminha lotes de telemetria para o Firehose.
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql: !Sub "SELECT VALUE readings FROM '${MqttTopicFilter}'"
        Actions:
          - Firehose:
              DeliveryStreamName: !Ref TelemetryDeliveryStream
              RoleArn: !GetAtt IoTRuleRole.Arn
              BatchMode: true
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref IoTRuleErrorLogGroup
            RoleArn: !GetAtt IoTRuleRole.Arn

  IoTRuleErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/iot/${ProjectName}/rule-errors'
      RetentionInDays: 14

  IoTRuleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: publica-no-firehose
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource:
                  - !GetAtt TelemetryDeliveryStream.Arn
                  - !GetAtt PositionDeliveryStream.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !GetAtt IoTRuleErrorLogGroup.Arn

  # ---------------------------------------------------------------------------
  # IoT Core - regra que joga as posicoes no Firehose
  #
  #   { "positions": [
  #       {"device_id":"trator-01","event_time":"2026-08-27T14:00:00Z",
  #        "lat":-23.5505,"lon":-46.6333,"speed":8.2,"heading":137,
  #        "batch_id":"b-1","seq":0}, ... ] }
  #
  # Mesmo fan-out por BatchMode da regra de telemetria: cada elemento do array
  # vira um registro. A 1 fix a cada 5 s, um lote por minuto tem 12 elementos,
  # bem abaixo do teto de 500 por chamada.
  # ---------------------------------------------------------------------------

  PositionTopicRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub
        - '${Name}_position'
        - Name: !Join ['_', !Split ['-', !Ref ProjectName]]
      TopicRulePayload:
        Description: Encaminha lotes de posicao para o Firehose.
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql: !Sub "SELECT VALUE positions FROM '${PositionTopicFilter}'"
        Actions:
          - Firehose:
              DeliveryStreamName: !Ref PositionDeliveryStream
              RoleArn: !GetAtt IoTRuleRole.Arn
              BatchMode: true
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref IoTRuleErrorLogGroup
            RoleArn: !GetAtt IoTRuleRole.Arn

  # ---------------------------------------------------------------------------
  # DynamoDB - rollups servidos ao frontend
  #
  # pk = DEV#<device_id>#<metric>
  # sk = AGG#<granularidade>#<inicio_do_bucket>   ex. AGG#1h#2026-08-26T14
  # Uma Query com between no sk devolve a serie pronta para o grafico.
  # ---------------------------------------------------------------------------

  RollupTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-rollups'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------------
  # Publicacao do script do Glue Job
  #
  # O Git sync aplica o template, mas nao copia arquivos do repositorio para o
  # S3. Sem isto, o job apontaria para um objeto inexistente ate alguem rodar
  # um 'aws s3 cp' na mao -- e o trigger horario falharia nesse meio tempo.
  #
  # O conteudo vai numa propriedade do custom resource, nao no ZipFile da
  # funcao: inline Lambda tem teto de 4096 caracteres, propriedade nao. Como
  # efeito colateral util, editar o script muda a propriedade e o
  # CloudFormation reenvia o arquivo no proximo sync.
  # ---------------------------------------------------------------------------

  RollupScript:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt ScriptWriterFunction.Arn
      Bucket: !Ref DataBucket
      Key: scripts/rollup_job.py
      Content: |
        """
        Glue Job: le a tabela Iceberg de telemetria bruta, calcula rollups em tres
        granularidades e grava no DynamoDB para o frontend consumir.

        Cada bucket carrega min / max / avg / count. Media sozinha apaga o pico, que
        num grafico de sensor costuma ser exatamente o que interessa.

        A escrita e idempotente: o item e sobrescrito por (pk, sk), entao reprocessar
        a mesma janela produz o mesmo resultado. Isso permite rodar com lookback
        generoso para absorver dado que chegou atrasado.
        """

        import sys
        from datetime import datetime, timedelta, timezone
        from decimal import Decimal

        import boto3
        from awsglue.context import GlueContext
        from awsglue.job import Job
        from awsglue.utils import getResolvedOptions
        from pyspark.context import SparkContext
        from pyspark.sql import Window
        from pyspark.sql import functions as F
        from pyspark.sql.types import DoubleType, StringType

        ARGS = getResolvedOptions(
            sys.argv,
            [
                "JOB_NAME",
                "glue_database",
                "source_table",
                "dynamo_table",
                "lookback_hours",
                "ttl_days",
                "positions_table",
                "sample_seconds",
            ],
        )

        LOOKBACK_HOURS = int(ARGS["lookback_hours"])
        TTL_DAYS = int(ARGS["ttl_days"])
        DYNAMO_TABLE = ARGS["dynamo_table"]
        SAMPLE_SECONDS = int(ARGS["sample_seconds"])

        # Precisao do geohash -> (rotulo, tamanho aproximado da celula).
        # p7 e a visao da fazenda; p9 e menor que a largura do implemento (6 a 12 m),
        # que e a condicao para sobreposicao aparecer no mapa.
        HEAT_GROSSA, HEAT_FINA = 7, 9

        # Um ponto sem sucessor, ou com sucessor muito distante no tempo, nao pode
        # arrastar horas de permanencia para a celula onde o trator estacionou.
        DT_MAXIMO = SAMPLE_SECONDS * 3

        # granularidade -> (expressao de truncamento, formato da chave, dias de TTL)
        # TTL curto no minuto e longo no dia: o grafico de range largo nunca pede
        # granularidade fina, entao guardar 1min por 45 dias so paga armazenamento.
        GRANULARITIES = {
            "1min": ("minute", "yyyy-MM-dd'T'HH:mm", 7),
            "1h": ("hour", "yyyy-MM-dd'T'HH", TTL_DAYS),
            "1d": ("day", "yyyy-MM-dd", TTL_DAYS * 8),
        }

        sc = SparkContext.getOrCreate()
        glue_context = GlueContext(sc)
        spark = glue_context.spark_session
        job = Job(glue_context)
        job.init(ARGS["JOB_NAME"], ARGS)

        source = f"glue_catalog.{ARGS['glue_database']}.{ARGS['source_table']}"
        cutoff = datetime.now(timezone.utc) - timedelta(hours=LOOKBACK_HOURS)

        raw = (
            spark.read.format("iceberg")
            .load(source)
            .filter(F.col("event_time") >= F.lit(cutoff))
        )

        # Deduplicacao na origem: retry de um lote HTTP reenvia os mesmos registros.
        # O exactly-once do Firehose garante entrega, nao ausencia de duplicata na
        # origem -- (batch_id, seq) e o que resolve isso.
        raw = raw.dropDuplicates(["device_id", "batch_id", "seq"])

        if raw.head(1):

            def rollup(granularity: str):
                trunc_unit, key_format, ttl_days = GRANULARITIES[granularity]
                bucket = F.date_trunc(trunc_unit, F.col("event_time"))
                expires = int(
                    (datetime.now(timezone.utc) + timedelta(days=ttl_days)).timestamp()
                )
                return (
                    raw.withColumn("bucket_start", bucket)
                    .groupBy("device_id", "metric", "bucket_start")
                    .agg(
                        F.min("value").alias("min_value"),
                        F.max("value").alias("max_value"),
                        F.avg("value").alias("avg_value"),
                        F.count("*").alias("sample_count"),
                        F.first("unit", ignorenulls=True).alias("unit"),
                    )
                    .select(
                        F.concat_ws("#", F.lit("DEV"), "device_id", "metric").alias("pk"),
                        F.concat_ws(
                            "#",
                            F.lit("AGG"),
                            F.lit(granularity),
                            F.date_format("bucket_start", key_format),
                        ).alias("sk"),
                        F.col("min_value"),
                        F.col("max_value"),
                        F.col("avg_value"),
                        F.col("sample_count"),
                        F.col("unit"),
                        F.date_format("bucket_start", "yyyy-MM-dd'T'HH:mm:ss'Z'").alias(
                            "bucket_start"
                        ),
                        F.lit(expires).alias("expires_at"),
                    )
                )

            def write_partition(rows):
                """Grava uma particao Spark no DynamoDB.

                batch_writer faz o chunking de 25 itens e reenvia UnprocessedItems
                automaticamente, com backoff.
                """
                table = boto3.resource("dynamodb").Table(DYNAMO_TABLE)
                with table.batch_writer(overwrite_by_pkeys=["pk", "sk"]) as batch:
                    for row in rows:
                        batch.put_item(
                            Item={
                                "pk": row["pk"],
                                "sk": row["sk"],
                                "bucket_start": row["bucket_start"],
                                "min": Decimal(str(round(row["min_value"], 6))),
                                "max": Decimal(str(round(row["max_value"], 6))),
                                "avg": Decimal(str(round(row["avg_value"], 6))),
                                "n": int(row["sample_count"]),
                                "unit": row["unit"] or "",
                                "expires_at": int(row["expires_at"]),
                            }
                        )

            def write_catalog():
                """Grava um item por (device, metrica) sob a particao CATALOG.

                Sem isto, listar os dispositivos exigiria um Scan da tabela. Com o
                item de catalogo, a API resolve a listagem com uma Query em
                pk = "CATALOG", que nao cresce com o historico -- so com a
                quantidade de series distintas.

                O TTL e renovado a cada execucao: um device que parar de reportar
                some da listagem sozinho depois de TTL_DAYS, sem nenhuma limpeza.
                """
                expires = int(
                    (datetime.now(timezone.utc) + timedelta(days=TTL_DAYS)).timestamp()
                )
                series = (
                    raw.groupBy("device_id", "metric")
                    .agg(
                        F.max("event_time").alias("last_seen"),
                        F.first("unit", ignorenulls=True).alias("unit"),
                    )
                    .collect()
                )
                table = boto3.resource("dynamodb").Table(DYNAMO_TABLE)
                with table.batch_writer(overwrite_by_pkeys=["pk", "sk"]) as batch:
                    for row in series:
                        batch.put_item(
                            Item={
                                "pk": "CATALOG",
                                "sk": f"DEV#{row['device_id']}#{row['metric']}",
                                "device_id": row["device_id"],
                                "metric": row["metric"],
                                "unit": row["unit"] or "",
                                "last_seen": row["last_seen"].strftime(
                                    "%Y-%m-%dT%H:%M:%SZ"
                                ),
                                "expires_at": expires,
                            }
                        )
                print(f"[rollup] catalogo: {len(series)} series")

            for granularity in GRANULARITIES:
                df = rollup(granularity)
                total = df.count()
                print(f"[rollup] {granularity}: {total} buckets")
                if total:
                    # Reparticiona para paralelizar a escrita sem estourar a
                    # particao quente do DynamoDB.
                    df.repartition(4).foreachPartition(write_partition)

            # Roda no driver: a cardinalidade e o numero de series, nao de linhas.
            write_catalog()
        else:
            print("[rollup] nenhum registro na janela; nada a fazer")


        # =============================================================================
        # Posicao (GPS dos tratores) -> heatmap por celula de geohash
        #
        # Aqui a agregacao certa nao e temporal, e espacial: quanto tempo o trator
        # permaneceu em cada pedaco de terreno. Geohash da isso com uma propriedade
        # util de graca -- celulas vizinhas compartilham prefixo, entao begins_with no
        # DynamoDB recorta uma regiao do mapa como between recorta um intervalo.
        #
        # O valor da celula e TEMPO, nao contagem de amostras. Contagem e enviesada
        # pela taxa de reporte: perda de sinal ou reporte adaptativo mentem no mapa.
        # =============================================================================

        BASE32 = "0123456789bcdefghjkmnpqrstuvwxyz"


        def geohash(lat, lon, precisao):
            """Codifica lat/lon em geohash. Sem dependencia: o Glue nao tem pacote extra.

            O prefixo e a propriedade que interessa aqui: celulas vizinhas no espaco
            compartilham prefixo, entao begins_with no DynamoDB recorta uma regiao do
            mapa do mesmo jeito que between recorta um intervalo de tempo.
            """
            lat_min, lat_max = -90.0, 90.0
            lon_min, lon_max = -180.0, 180.0
            codigo, bits, valor, par = [], 0, 0, True
            while len(codigo) < precisao:
                if par:
                    meio = (lon_min + lon_max) / 2
                    if lon >= meio:
                        valor = valor * 2 + 1
                        lon_min = meio
                    else:
                        valor = valor * 2
                        lon_max = meio
                else:
                    meio = (lat_min + lat_max) / 2
                    if lat >= meio:
                        valor = valor * 2 + 1
                        lat_min = meio
                    else:
                        valor = valor * 2
                        lat_max = meio
                par = not par
                bits += 1
                if bits == 5:
                    codigo.append(BASE32[valor])
                    bits, valor = 0, 0
            return "".join(codigo)


        def centro(codigo):
            """Devolve (lat, lon) do centro da celula e o tamanho dela em graus."""
            lat_min, lat_max = -90.0, 90.0
            lon_min, lon_max = -180.0, 180.0
            par = True
            for caractere in codigo:
                valor = BASE32.index(caractere)
                for deslocamento in (16, 8, 4, 2, 1):
                    bit = 1 if valor & deslocamento else 0
                    if par:
                        meio = (lon_min + lon_max) / 2
                        if bit:
                            lon_min = meio
                        else:
                            lon_max = meio
                    else:
                        meio = (lat_min + lat_max) / 2
                        if bit:
                            lat_min = meio
                        else:
                            lat_max = meio
                    par = not par
            return ((lat_min + lat_max) / 2, (lon_min + lon_max) / 2,
                    lat_max - lat_min, lon_max - lon_min)


        geohash_udf = F.udf(geohash, StringType())
        centro_lat_udf = F.udf(lambda c: centro(c)[0], DoubleType())
        centro_lon_udf = F.udf(lambda c: centro(c)[1], DoubleType())

        # A janela de recomputacao do heatmap comeca no INICIO do dia mais antigo
        # alcancado pelo lookback, e nao no lookback em si. Motivo: o item da celula
        # acumula o dia inteiro e e sobrescrito por (pk, sk); recomputar so as ultimas
        # horas e sobrescrever apagaria a permanencia acumulada antes. Recomputando o
        # dia inteiro a escrita continua idempotente.
        heat_inicio = (datetime.now(timezone.utc) - timedelta(hours=LOOKBACK_HOURS)).replace(
            hour=0, minute=0, second=0, microsecond=0
        )

        posicoes = (
            spark.read.format("iceberg")
            .load(f"glue_catalog.{ARGS['glue_database']}.{ARGS['positions_table']}")
            .filter(F.col("event_time") >= F.lit(heat_inicio))
            .dropDuplicates(["device_id", "batch_id", "seq"])
        )

        if posicoes.head(1):
            ordem = Window.partitionBy("device_id").orderBy("event_time")

            passo = (
                posicoes.withColumn("prox_time", F.lead("event_time").over(ordem))
                .withColumn("prox_lat", F.lead("lat").over(ordem))
                .withColumn("prox_lon", F.lead("lon").over(ordem))
                # dt do ponto ate o proximo, limitado: sem o teto, um trator desligado
                # as 18h e religado as 6h doaria 12 h para a celula onde estacionou.
                .withColumn(
                    "dt",
                    F.least(
                        F.greatest(
                            F.coalesce(
                                F.unix_timestamp("prox_time") - F.unix_timestamp("event_time"),
                                F.lit(SAMPLE_SECONDS),
                            ),
                            F.lit(0),
                        ),
                        F.lit(DT_MAXIMO),
                    ),
                )
                # Haversine ate o proximo ponto. Distancia e dt saem do mesmo par, entao
                # velocidade = distancia / tempo fecha sem o device precisar informar.
                .withColumn(
                    "dist_m",
                    F.when(
                        F.col("prox_lat").isNull(), F.lit(0.0)
                    ).otherwise(
                        F.lit(2 * 6371000.0)
                        * F.asin(
                            F.sqrt(
                                F.pow(F.sin(F.radians(F.col("prox_lat") - F.col("lat")) / 2), 2)
                                + F.cos(F.radians(F.col("lat")))
                                * F.cos(F.radians(F.col("prox_lat")))
                                * F.pow(
                                    F.sin(F.radians(F.col("prox_lon") - F.col("lon")) / 2), 2
                                )
                            )
                        )
                    ),
                )
                .withColumn("dia", F.date_format("event_time", "yyyy-MM-dd"))
                .withColumn("gh_grossa", geohash_udf("lat", "lon", F.lit(HEAT_GROSSA)))
                .withColumn("gh_fina", geohash_udf("lat", "lon", F.lit(HEAT_FINA)))
            )

            def celulas(chaves, coluna_celula):
                return (
                    passo.groupBy(*chaves)
                    .agg(
                        F.sum("dt").alias("secs"),
                        F.sum("dist_m").alias("dist_m"),
                        F.count("*").alias("n"),
                    )
                    .withColumn("cell_lat", centro_lat_udf(F.col(coluna_celula)))
                    .withColumn("cell_lon", centro_lon_udf(F.col(coluna_celula)))
                )

            def escreve_celulas(linhas, monta_chave, coluna_celula, prefixo_sk, expira):
                table = boto3.resource("dynamodb").Table(DYNAMO_TABLE)
                with table.batch_writer(overwrite_by_pkeys=["pk", "sk"]) as batch:
                    for linha in linhas:
                        segundos = float(linha["secs"])
                        batch.put_item(
                            Item={
                                "pk": monta_chave(linha),
                                "sk": f"{prefixo_sk}#{linha[coluna_celula]}",
                                "gh": linha[coluna_celula],
                                "lat": Decimal(str(round(linha["cell_lat"], 7))),
                                "lon": Decimal(str(round(linha["cell_lon"], 7))),
                                "secs": int(segundos),
                                "dist_m": Decimal(str(round(float(linha["dist_m"]), 2))),
                                "n": int(linha["n"]),
                                "expires_at": expira,
                            }
                        )

            expira_heat = int(
                (datetime.now(timezone.utc) + timedelta(days=TTL_DAYS * 8)).timestamp()
            )

            # Camada grossa: poucas celulas por dia, uma Query resolve a fazenda toda.
            grossa = celulas(["device_id", "dia", "gh_grossa"], "gh_grossa").collect()
            escreve_celulas(
                grossa,
                lambda l: f"HEAT#{l['device_id']}#{l['dia']}",
                "gh_grossa",
                f"GH{HEAT_GROSSA}",
                expira_heat,
            )

            # Camada fina: a celula grossa vira a particao, entao o viewport do mapa
            # diz exatamente quais pk pedir -- sem varrer o dia inteiro na resolucao
            # de 5 m.
            fina = celulas(["device_id", "dia", "gh_grossa", "gh_fina"], "gh_fina")
            total_fina = fina.count()
            if total_fina:
                fina.repartition(4).foreachPartition(
                    lambda linhas: escreve_celulas(
                        linhas,
                        lambda l: f"HEAT#{l['device_id']}#{l['dia']}#{l['gh_grossa']}",
                        "gh_fina",
                        f"GH{HEAT_FINA}",
                        expira_heat,
                    )
                )

            # Ultima posicao conhecida: um item sobrescrito por device. E o que um mapa
            # ao vivo precisa, e sai de graca desta passagem.
            recentes = (
                posicoes.withColumn(
                    "ordem", F.row_number().over(
                        Window.partitionBy("device_id").orderBy(F.col("event_time").desc())
                    )
                )
                .filter(F.col("ordem") == 1)
                .collect()
            )
            table = boto3.resource("dynamodb").Table(DYNAMO_TABLE)
            with table.batch_writer(overwrite_by_pkeys=["pk", "sk"]) as batch:
                for linha in recentes:
                    batch.put_item(
                        Item={
                            "pk": f"DEV#{linha['device_id']}#position",
                            "sk": "LATEST",
                            "lat": Decimal(str(round(float(linha["lat"]), 7))),
                            "lon": Decimal(str(round(float(linha["lon"]), 7))),
                            "at": linha["event_time"].strftime("%Y-%m-%dT%H:%M:%SZ"),
                            "expires_at": expira_heat,
                        }
                    )

            print(
                f"[heatmap] p{HEAT_GROSSA}: {len(grossa)} celulas | "
                f"p{HEAT_FINA}: {total_fina} celulas | "
                f"{len(recentes)} posicoes atuais"
            )
        else:
            print("[heatmap] nenhuma posicao na janela; nada a fazer")

        job.commit()
  ScriptWriterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-script-writer'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ScriptWriterRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          s3 = boto3.client("s3")

          def handler(event, context):
              props = event["ResourceProperties"]
              bucket, key = props["Bucket"], props["Key"]
              uri = f"s3://{bucket}/{key}"
              try:
                  if event["RequestType"] == "Delete":
                      # O bucket de dados tem DeletionPolicy Retain, mas pode
                      # ter sido removido a mao. Falhar aqui travaria o delete
                      # da pilha.
                      try:
                          s3.delete_object(Bucket=bucket, Key=key)
                      except Exception:
                          pass
                  else:
                      extra = {}
                      for campo in ("ContentType", "CacheControl"):
                          if props.get(campo):
                              extra[campo] = props[campo]
                      s3.put_object(
                          Bucket=bucket,
                          Key=key,
                          Body=props["Content"].encode("utf-8"),
                          **extra,
                      )
                  cfnresponse.send(
                      event, context, cfnresponse.SUCCESS, {"Uri": uri}, uri
                  )
              except Exception as exc:
                  cfnresponse.send(
                      event, context, cfnresponse.FAILED, {"Erro": str(exc)}, uri
                  )
  ScriptWriterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: publica-script-do-job
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub '${DataBucket.Arn}/scripts/*'
                  - !Sub '${SiteBucket.Arn}/*'

  # ---------------------------------------------------------------------------
  # Glue Job - agregacao 1min / 1h / 1d
  # ---------------------------------------------------------------------------

  RollupJob:
    Type: AWS::Glue::Job
    DependsOn:
      - TelemetryRawTable
      - PositionsRawTable
    Properties:
      Name: !Sub '${ProjectName}-rollups'
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      MaxRetries: 1
      Timeout: 30
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Role: !GetAtt GlueJobRole.Arn
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !GetAtt RollupScript.Uri
      DefaultArguments:
        '--job-language': python
        '--datalake-formats': iceberg
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-observability-metrics': 'true'
        '--TempDir': !Sub 's3://${DataBucket}/tmp/'
        '--glue_database': !Ref GlueDatabase
        '--source_table': telemetry_raw
        '--positions_table': positions_raw
        '--sample_seconds': !Ref PositionSampleSeconds
        '--warehouse': !Sub 's3://${DataBucket}/warehouse/'
        '--dynamo_table': !Ref RollupTable
        '--lookback_hours': !Ref RollupLookbackHours
        '--ttl_days': !Ref HotStoreTtlDays
        '--conf': !Sub >-
          spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
          --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog
          --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
          --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
          --conf spark.sql.catalog.glue_catalog.warehouse=s3://${DataBucket}/warehouse/

  RollupSchedule:
    Type: AWS::Glue::Trigger
    Properties:
      Name: !Sub '${ProjectName}-rollup-schedule'
      Type: SCHEDULED
      Schedule: 'cron(5 * * * ? *)'
      StartOnCreation: true
      Actions:
        - JobName: !Ref RollupJob

  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSGlueServiceRole'
      Policies:
        - PolicyName: le-iceberg-escreve-dynamo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:UpdateTable
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabase}'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabase}/*'
              - Effect: Allow
                Action:
                  - dynamodb:BatchWriteItem
                  - dynamodb:PutItem
                  - dynamodb:DescribeTable
                Resource: !GetAtt RollupTable.Arn

  # ---------------------------------------------------------------------------
  # API de leitura - HTTP API sobre a tabela de rollups
  #
  #   GET /devices/{device_id}/metrics/{metric}?from=...&to=...[&granularity=]
  #
  # A rota espelha a chave da tabela, entao cada request vira exatamente uma
  # Query -- nunca um Scan. HTTP API em vez de REST API: ~3x mais barato por
  # requisicao e CORS nativo, sem precisar de nada que so o REST oferece.
  # ---------------------------------------------------------------------------

  QueryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-api-query'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt QueryFunctionRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref RollupTable
          CORS_ORIGIN: !Ref ApiCorsOrigin
      Code:
        ZipFile: |
          import json
          import os
          from datetime import datetime, timezone
          from decimal import Decimal

          import boto3
          from boto3.dynamodb.conditions import Key

          TABELA = boto3.resource("dynamodb").Table(os.environ["TABLE"])
          ORIGEM = os.environ["CORS_ORIGIN"]
          TETO = 5000

          # granularidade -> (range maximo em segundos, caracteres do prefixo de tempo)
          # Espelha o formato de chave gravado pelo Glue Job:
          #   1min aaaa-mm-ddTHH:MM | 1h aaaa-mm-ddTHH | 1d aaaa-mm-dd
          FAIXAS = (("1min", 6 * 3600, 16), ("1h", 30 * 86400, 13), ("1d", None, 10))
          CORTES = {g: c for g, _, c in FAIXAS}


          def instante(texto):
              return datetime.fromisoformat(texto.replace("Z", "+00:00"))


          def responde(status, corpo, cache="no-store"):
              return {
                  "statusCode": status,
                  "headers": {
                      "content-type": "application/json",
                      "access-control-allow-origin": ORIGEM,
                      "cache-control": cache,
                  },
                  "body": json.dumps(corpo, default=float),
              }


          def handler(event, context):
              caminho = event.get("pathParameters") or {}
              query = event.get("queryStringParameters") or {}
              device, metrica = caminho.get("device_id"), caminho.get("metric")

              try:
                  inicio, fim = instante(query["from"]), instante(query["to"])
              except (KeyError, ValueError, TypeError):
                  return responde(400, {"erro": "from e to obrigatorios, em ISO-8601 UTC"})
              if fim <= inicio:
                  return responde(400, {"erro": "to precisa ser maior que from"})

              gran = query.get("granularity")
              if not gran:
                  janela = (fim - inicio).total_seconds()
                  gran = next(g for g, teto, _ in FAIXAS if teto is None or janela <= teto)
              if gran not in CORTES:
                  return responde(400, {"erro": f"granularity invalida: {gran}"})

              corte = CORTES[gran]
              condicao = Key("pk").eq(f"DEV#{device}#{metrica}") & Key("sk").between(
                  f"AGG#{gran}#{inicio.isoformat()[:corte]}",
                  f"AGG#{gran}#{fim.isoformat()[:corte]}",
              )

              pontos, proxima = [], None
              while len(pontos) < TETO:
                  extra = {"ExclusiveStartKey": proxima} if proxima else {}
                  pagina = TABELA.query(KeyConditionExpression=condicao, **extra)
                  pontos += [
                      {
                          "t": item["bucket_start"],
                          "min": item["min"],
                          "max": item["max"],
                          "avg": item["avg"],
                          "n": int(item["n"]),
                          "unit": item.get("unit") or None,
                      }
                      for item in pagina["Items"]
                  ]
                  proxima = pagina.get("LastEvaluatedKey")
                  if not proxima:
                      break

              # Bucket fechado nao muda mais; so a janela que alcanca o presente
              # precisa de cache curto.
              encerrado = fim < datetime.now(timezone.utc)
              return responde(
                  200,
                  {
                      "device_id": device,
                      "metric": metrica,
                      "granularity": gran,
                      "from": query["from"],
                      "to": query["to"],
                      "truncated": len(pontos) >= TETO,
                      "count": len(pontos),
                      "points": pontos,
                  },
                  "public, max-age=86400" if encerrado else "public, max-age=30",
              )
  QueryFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: le-rollups
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Somente Query: a API nao tem como cair num Scan da tabela.
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt RollupTable.Arn

  RollupApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-api'
      Description: Serie temporal de rollups para o frontend.
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref ApiCorsOrigin
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - content-type
        MaxAge: 300

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RollupApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt QueryFunction.Arn
      PayloadFormatVersion: '2.0'

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'GET /devices/{device_id}/metrics/{metric}'
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref RollupApi
      StageName: $default
      AutoDeploy: true
      # A tabela e PAY_PER_REQUEST: sem teto, um cliente em loop vira conta.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
        DetailedMetricsEnabled: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","rota":"$context.routeKey","status":"$context.status","erroIntegracao":"$context.integration.error","ms":"$context.responseLatency"}'

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${ProjectName}'
      RetentionInDays: 14

  # Listagem de dispositivos. Existe porque o frontend precisa descobrir o
  # que consultar; sem o item de catalogo isso seria um Scan.
  CatalogFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-api-catalog'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt QueryFunctionRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref RollupTable
          CORS_ORIGIN: !Ref ApiCorsOrigin
      Code:
        ZipFile: |
          import json
          import os
          from collections import defaultdict

          import boto3
          from boto3.dynamodb.conditions import Key

          TABELA = boto3.resource("dynamodb").Table(os.environ["TABLE"])
          ORIGEM = os.environ["CORS_ORIGIN"]


          def handler(event, context):
              # O Glue Job mantem um item por (device, metrica) sob pk = "CATALOG".
              # Sem ele, listar dispositivos exigiria um Scan da tabela inteira.
              dispositivos = defaultdict(list)
              proxima = None
              while True:
                  extra = {"ExclusiveStartKey": proxima} if proxima else {}
                  pagina = TABELA.query(
                      KeyConditionExpression=Key("pk").eq("CATALOG"), **extra
                  )
                  for item in pagina["Items"]:
                      dispositivos[item["device_id"]].append({
                          "metric": item["metric"],
                          "unit": item.get("unit") or None,
                          "last_seen": item.get("last_seen"),
                      })
                  proxima = pagina.get("LastEvaluatedKey")
                  if not proxima:
                      break

              corpo = {
                  "count": len(dispositivos),
                  "devices": [
                      {
                          "device_id": device,
                          "metrics": sorted(metricas, key=lambda m: m["metric"]),
                      }
                      for device, metricas in sorted(dispositivos.items())
                  ],
              }
              return {
                  "statusCode": 200,
                  "headers": {
                      "content-type": "application/json",
                      "access-control-allow-origin": ORIGEM,
                      "cache-control": "public, max-age=60",
                  },
                  "body": json.dumps(corpo),
              }
  CatalogIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RollupApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CatalogFunction.Arn
      PayloadFormatVersion: '2.0'

  CatalogRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'GET /devices'
      Target: !Sub 'integrations/${CatalogIntegration}'

  CatalogInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CatalogFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RollupApi}/*'

  # Heatmap: celulas de geohash com permanencia por celula.
  HeatmapFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-api-heatmap'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt QueryFunctionRole.Arn
      Timeout: 25
      MemorySize: 512
      Environment:
        Variables:
          TABLE: !Ref RollupTable
          CORS_ORIGIN: !Ref ApiCorsOrigin
      Code:
        ZipFile: |
          import json
          import os

          import boto3
          from boto3.dynamodb.conditions import Key

          TABELA = boto3.resource("dynamodb").Table(os.environ["TABLE"])
          ORIGEM = os.environ["CORS_ORIGIN"]
          TETO = 20000
          DIAS_MAX = 31

          # Tamanho da celula em graus, derivado da precisao: p caracteres = 5p bits,
          # repartidos entre longitude (os impares) e latitude. Vai na resposta para o
          # cliente desenhar o retangulo sem precisar decodificar geohash.
          def tamanho_celula(precisao):
              bits = 5 * precisao
              bits_lon = (bits + 1) // 2
              bits_lat = bits // 2
              return 180.0 / (2 ** bits_lat), 360.0 / (2 ** bits_lon)


          def responde(status, corpo, cache="no-store"):
              return {
                  "statusCode": status,
                  "headers": {
                      "content-type": "application/json",
                      "access-control-allow-origin": ORIGEM,
                      "cache-control": cache,
                  },
                  "body": json.dumps(corpo, default=float),
              }


          def dias_entre(inicio, fim):
              from datetime import date, timedelta
              a = date.fromisoformat(inicio)
              b = date.fromisoformat(fim)
              if b < a:
                  return None
              saida, atual = [], a
              while atual <= b and len(saida) <= DIAS_MAX:
                  saida.append(atual.isoformat())
                  atual += timedelta(days=1)
              return saida


          def handler(event, context):
              caminho = event.get("pathParameters") or {}
              query = event.get("queryStringParameters") or {}
              device = caminho.get("device_id")

              try:
                  dias = dias_entre(query["from"], query["to"])
              except (KeyError, ValueError, TypeError):
                  return responde(400, {"erro": "from e to obrigatorios, em AAAA-MM-DD"})
              if dias is None:
                  return responde(400, {"erro": "to precisa ser maior ou igual a from"})
              if len(dias) > DIAS_MAX:
                  return responde(400, {"erro": f"intervalo maior que {DIAS_MAX} dias"})

              # A celula grossa e a particao da fina: o cliente manda a celula que esta
              # no viewport e recebe so o detalhe dela, em vez do dia inteiro a 5 m.
              celula = query.get("cell")
              precisao = 9 if celula else 7
              prefixo = f"GH{precisao}"

              celulas = {}
              truncado = False
              for dia in dias:
                  pk = f"HEAT#{device}#{dia}" + (f"#{celula}" if celula else "")
                  proxima = None
                  while True:
                      extra = {"ExclusiveStartKey": proxima} if proxima else {}
                      pagina = TABELA.query(
                          KeyConditionExpression=(
                              Key("pk").eq(pk) & Key("sk").begins_with(prefixo + "#")
                          ),
                          **extra,
                      )
                      for item in pagina["Items"]:
                          # Somar entre dias: a mesma celula reaparece a cada passagem.
                          chave = item["gh"]
                          acumulado = celulas.setdefault(
                              chave,
                              {"gh": chave, "lat": item["lat"], "lon": item["lon"],
                               "secs": 0, "dist_m": 0, "n": 0},
                          )
                          acumulado["secs"] += int(item["secs"])
                          acumulado["dist_m"] += float(item["dist_m"])
                          acumulado["n"] += int(item["n"])
                      proxima = pagina.get("LastEvaluatedKey")
                      if not proxima or len(celulas) >= TETO:
                          truncado = truncado or bool(proxima)
                          break

              d_lat, d_lon = tamanho_celula(precisao)
              return responde(
                  200,
                  {
                      "device_id": device,
                      "precision": precisao,
                      "cell": celula,
                      "from": query["from"],
                      "to": query["to"],
                      "cellSize": {"lat": d_lat, "lon": d_lon},
                      "truncated": truncado,
                      "count": len(celulas),
                      "cells": sorted(celulas.values(), key=lambda c: c["gh"]),
                  },
                  "public, max-age=300",
              )

  HeatmapIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RollupApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt HeatmapFunction.Arn
      PayloadFormatVersion: '2.0'

  HeatmapRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'GET /devices/{device_id}/heatmap'
      Target: !Sub 'integrations/${HeatmapIntegration}'

  HeatmapInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HeatmapFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RollupApi}/*'

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref QueryFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RollupApi}/*'

  # ---------------------------------------------------------------------------
  # Frontend estatico - bucket privado + CloudFront
  #
  # O bucket nao e publico: quem le e a distribuicao, via Origin Access
  # Control. Alem de evitar bucket aberto, isso da HTTPS -- o endpoint de
  # website do S3 serve so em HTTP -- e e o CloudFront na frente que aproveita
  # o Cache-Control longo que a API devolve para janela ja fechada.
  # ---------------------------------------------------------------------------

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-site-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-site-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${ProjectName} - dashboard de telemetria'
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        # PriceClass_All porque as classes menores nao incluem a America do
        # Sul; com 100 ou 200 o acesso daqui sairia de outro continente.
        PriceClass: PriceClass_All
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized: honra o Cache-Control da origem.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  FrontendIndex:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt ScriptWriterFunction.Arn
      Bucket: !Ref SiteBucket
      Key: index.html
      ContentType: 'text/html; charset=utf-8'
      # Curto de proposito: o CloudFront revalida em vez de servir uma versao
      # velha da pagina depois de um deploy, sem precisar de invalidacao.
      CacheControl: 'public, max-age=60'
      Content: |
        <!doctype html>
        <html lang="pt-BR">
        <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Telemetria IoT</title>
        <style>
          :root {
            color-scheme: light;
            --plano:          #f9f9f7;
            --superficie:     #fcfcfb;
            --tinta:          #0b0b0b;
            --tinta-2:        #52514e;
            --tinta-mud:      #898781;
            --grade:          #e1e0d9;
            --eixo:           #c3c2b7;
            --borda:          rgba(11,11,11,0.10);
            --serie:          #2a78d6;
            --serie-faixa:    rgba(42,120,214,0.16);
            --critico:        #d03b3b;
          }
          @media (prefers-color-scheme: dark) {
            :root:where(:not([data-theme="light"])) {
              color-scheme: dark;
              --plano: #0d0d0d; --superficie: #1a1a19; --tinta: #ffffff;
              --tinta-2: #c3c2b7; --tinta-mud: #898781; --grade: #2c2c2a;
              --eixo: #383835; --borda: rgba(255,255,255,0.10);
              --serie: #3987e5; --serie-faixa: rgba(57,135,229,0.20);
            }
          }
          :root[data-theme="dark"] {
            color-scheme: dark;
            --plano: #0d0d0d; --superficie: #1a1a19; --tinta: #ffffff;
            --tinta-2: #c3c2b7; --tinta-mud: #898781; --grade: #2c2c2a;
            --eixo: #383835; --borda: rgba(255,255,255,0.10);
            --serie: #3987e5; --serie-faixa: rgba(57,135,229,0.20);
          }

          * { box-sizing: border-box; }
          body {
            margin: 0; background: var(--plano); color: var(--tinta);
            font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
          }
          .envelope { max-width: 1040px; margin: 0 auto; padding: 24px 20px 56px; }

          header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
          h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
          header p { margin: 0; color: var(--tinta-mud); font-size: 13px; }
          .espacador { flex: 1; }

          button, select {
            font: inherit; color: var(--tinta); background: var(--superficie);
            border: 1px solid var(--borda); border-radius: 8px; padding: 7px 10px;
          }
          button { cursor: pointer; }
          button:hover, select:hover { border-color: var(--eixo); }
          button[aria-pressed="true"] { border-color: var(--serie); color: var(--serie); }

          .filtros {
            display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
            margin: 20px 0 14px;
          }
          .campo { display: flex; flex-direction: column; gap: 4px; }
          .campo label {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--tinta-mud);
          }

          .cartao {
            background: var(--superficie); border: 1px solid var(--borda);
            border-radius: 12px; padding: 18px;
          }

          .legenda { display: flex; gap: 16px; align-items: center;
                     font-size: 12px; color: var(--tinta-2); margin-bottom: 4px; }
          .legenda span { display: inline-flex; align-items: center; gap: 6px; }
          .amostra-linha { width: 18px; height: 2px; background: var(--serie); }
          .amostra-faixa { width: 18px; height: 10px; background: var(--serie-faixa);
                           border-radius: 2px; }

          .tiles { display: flex; gap: 22px; flex-wrap: wrap; margin: 16px 0 0;
                   padding-top: 14px; border-top: 1px solid var(--grade); }
          .tile-rotulo { font-size: 11px; text-transform: uppercase;
                         letter-spacing: 0.06em; color: var(--tinta-mud); }
          .tile-valor { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }

          svg { display: block; width: 100%; height: auto; }
          .grade-linha { stroke: var(--grade); stroke-width: 1; }
          .eixo-linha { stroke: var(--eixo); stroke-width: 1; }
          .marca-texto { fill: var(--tinta-mud); font-size: 11px;
                         font-variant-numeric: tabular-nums; }
          .rotulo-direto { fill: var(--tinta); font-size: 12px; font-weight: 600; }
          /* O SVG escala com o container e leva o texto junto; em tela estreita o
             rotulo ficaria ilegivel. Aumentar em unidades de viewBox compensa. */
          @media (max-width: 700px) {
            .marca-texto { font-size: 13px; }
            .rotulo-direto { font-size: 14px; }
            .legenda { flex-wrap: wrap; gap: 6px 14px; }
          }
          .cursor { stroke: var(--eixo); stroke-width: 1; stroke-dasharray: 3 3; }

          .dica {
            position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
            background: var(--superficie); border: 1px solid var(--borda);
            border-radius: 8px; padding: 8px 10px; font-size: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; z-index: 2;
          }
          .dica b { display: block; margin-bottom: 4px; font-weight: 600; }
          .dica dl { margin: 0; display: grid; grid-template-columns: auto auto;
                     gap: 1px 12px; }
          .dica dt { color: var(--tinta-mud); }
          .dica dd { margin: 0; text-align: right;
                     font-variant-numeric: tabular-nums; }
          .area-grafico { position: relative; }

          table { border-collapse: collapse; width: 100%; font-size: 13px;
                  font-variant-numeric: tabular-nums; margin-top: 14px; }
          th, td { text-align: right; padding: 6px 8px;
                   border-bottom: 1px solid var(--grade); }
          th:first-child, td:first-child { text-align: left; }
          th { color: var(--tinta-mud); font-weight: 500; font-size: 11px;
               text-transform: uppercase; letter-spacing: 0.06em; }

          .abas { display: flex; gap: 8px; margin: 18px 0 0; }
          .abas button[aria-pressed="true"] { background: var(--serie); color: #fff;
                                              border-color: var(--serie); }

          .mapa-topo { display: flex; align-items: baseline; gap: 12px;
                       flex-wrap: wrap; margin-bottom: 10px; }
          .trilha { font-size: 13px; color: var(--tinta-2); }
          .trilha button { padding: 2px 8px; font-size: 12px; }

          #tela-mapa { display: block; width: 100%; height: auto;
                       border-radius: 8px; cursor: crosshair; }

          .escala { display: flex; align-items: center; gap: 8px; margin-top: 12px;
                    font-size: 12px; color: var(--tinta-2); flex-wrap: wrap; }
          .escala-faixa { display: flex; height: 10px; border-radius: 2px;
                          overflow: hidden; min-width: 160px; }
          .escala-faixa i { flex: 1; }

          .aviso { color: var(--tinta-2); padding: 28px 0; text-align: center; }
          .aviso.erro { color: var(--critico); }
          [hidden] { display: none !important; }
        </style>
        </head>
        <body>
        <div class="envelope">

          <header>
            <h1>Telemetria IoT</h1>
            <p id="resumo-fonte"></p>
            <span class="espacador"></span>
            <button id="tema" title="Alternar tema">Tema</button>
          </header>

          <div class="abas">
            <button id="aba-serie" aria-pressed="true">Série</button>
            <button id="aba-mapa" aria-pressed="false">Mapa</button>
          </div>

          <div id="vista-serie">
          <div class="filtros">
            <div class="campo">
              <label for="device">Dispositivo</label>
              <select id="device"></select>
            </div>
            <div class="campo">
              <label for="metric">Métrica</label>
              <select id="metric"></select>
            </div>
            <div class="campo">
              <label for="range">Intervalo</label>
              <select id="range">
                <option value="6">últimas 6 h</option>
                <option value="24" selected>últimas 24 h</option>
                <option value="168">últimos 7 d</option>
                <option value="720">últimos 30 d</option>
                <option value="2160">últimos 90 d</option>
              </select>
            </div>
            <button id="recarregar">Atualizar</button>
            <span class="espacador"></span>
            <button id="alterna-tabela" aria-pressed="false">Ver tabela</button>
          </div>

          <div class="cartao">
            <div class="legenda">
              <span><i class="amostra-linha"></i> média do bucket</span>
              <span><i class="amostra-faixa"></i> mínimo–máximo</span>
              <span id="granularidade"></span>
            </div>

            <div class="area-grafico">
              <svg id="grafico" viewBox="0 0 880 320" role="img"
                   aria-labelledby="titulo-grafico"></svg>
              <title id="titulo-grafico">Série temporal de leituras agregadas</title>
              <div class="dica" id="dica"></div>
            </div>

            <div class="tiles" id="tiles" hidden>
              <div><div class="tile-rotulo">Mínimo</div>
                   <div class="tile-valor" id="t-min">—</div></div>
              <div><div class="tile-rotulo">Máximo</div>
                   <div class="tile-valor" id="t-max">—</div></div>
              <div><div class="tile-rotulo">Média</div>
                   <div class="tile-valor" id="t-avg">—</div></div>
              <div><div class="tile-rotulo">Amostras</div>
                   <div class="tile-valor" id="t-n">—</div></div>
              <div><div class="tile-rotulo">Buckets</div>
                   <div class="tile-valor" id="t-buckets">—</div></div>
            </div>

            <div id="aviso" class="aviso">Carregando…</div>

            <div id="envelope-tabela" hidden>
              <table>
                <thead><tr>
                  <th>Início do bucket</th><th>Mín</th><th>Máx</th>
                  <th>Média</th><th>Amostras</th>
                </tr></thead>
                <tbody id="corpo-tabela"></tbody>
              </table>
            </div>
          </div>
          </div>

          <div id="vista-mapa" hidden>
            <div class="filtros">
              <div class="campo">
                <label for="mapa-device">Dispositivo</label>
                <select id="mapa-device"></select>
              </div>
              <div class="campo">
                <label for="mapa-de">De</label>
                <input id="mapa-de" type="date">
              </div>
              <div class="campo">
                <label for="mapa-ate">Até</label>
                <input id="mapa-ate" type="date">
              </div>
              <button id="mapa-recarregar">Atualizar</button>
            </div>

            <div class="cartao">
              <div class="mapa-topo">
                <span class="trilha" id="trilha"></span>
              </div>

              <div class="area-grafico">
                <canvas id="tela-mapa" role="img"
                        aria-label="Mapa de permanência por célula"></canvas>
                <div class="dica" id="dica-mapa"></div>
              </div>

              <div class="escala" id="escala" hidden>
                <span>menos tempo</span>
                <span class="escala-faixa" id="escala-faixa"></span>
                <span>mais tempo</span>
                <span id="escala-limites"></span>
              </div>

              <div class="tiles" id="mapa-tiles" hidden>
                <div><div class="tile-rotulo">Tempo total</div>
                     <div class="tile-valor" id="m-tempo">—</div></div>
                <div><div class="tile-rotulo">Distância</div>
                     <div class="tile-valor" id="m-dist">—</div></div>
                <div><div class="tile-rotulo">Velocidade média</div>
                     <div class="tile-valor" id="m-vel">—</div></div>
                <div><div class="tile-rotulo" id="m-area-rotulo">Área</div>
                     <div class="tile-valor" id="m-area">—</div></div>
                <div><div class="tile-rotulo">Células</div>
                     <div class="tile-valor" id="m-celulas">—</div></div>
              </div>

              <div id="mapa-aviso" class="aviso">Carregando…</div>
            </div>
          </div>
        </div>

        <script>
        (function () {
          "use strict";

          var API = null;
          var catalogo = [];
          var serie = [];
          var unidade = "";

          var el = function (id) { return document.getElementById(id); };

          // --------------------------------------------------------------- formato
          function numero(v, casas) {
            if (v === null || v === undefined) return "—";
            return Number(v).toFixed(casas === undefined ? 2 : casas);
          }

          function comUnidade(v) {
            var t = numero(v);
            return unidade ? t + " " + unidade : t;
          }

          function horario(iso, curto) {
            var d = new Date(iso);
            if (isNaN(d)) return iso;
            var opcoes = curto
              ? { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }
              : { dateStyle: "short", timeStyle: "short" };
            return d.toLocaleString("pt-BR", opcoes);
          }

          // ------------------------------------------------------------------ rede
          function pegar(caminho) {
            return fetch(API + caminho).then(function (r) {
              if (!r.ok) throw new Error("HTTP " + r.status + " em " + caminho);
              return r.json();
            });
          }

          function mostraAviso(texto, erro) {
            var a = el("aviso");
            a.textContent = texto;
            a.className = erro ? "aviso erro" : "aviso";
            a.hidden = false;
            el("grafico").innerHTML = "";
            el("tiles").hidden = true;
          }

          // -------------------------------------------------------------- catálogo
          function carregaCatalogo() {
            return pegar("/devices").then(function (dados) {
              catalogo = dados.devices || [];
              var sel = el("device");
              sel.innerHTML = "";
              catalogo.forEach(function (d) {
                var o = document.createElement("option");
                o.value = d.device_id;
                o.textContent = d.device_id;
                sel.appendChild(o);
              });
              el("resumo-fonte").textContent =
                catalogo.length + (catalogo.length === 1 ? " dispositivo" : " dispositivos");
              if (!catalogo.length) {
                mostraAviso("Nenhum dispositivo no catálogo ainda. O Glue Job popula "
                            + "essa lista na primeira execução após a chegada de dados.");
                return false;
              }
              var mapaSel = el("mapa-device");
              mapaSel.innerHTML = sel.innerHTML;
              var hoje = new Date();
              var semana = new Date(hoje.getTime() - 6 * 86400000);
              el("mapa-ate").value = hoje.toISOString().slice(0, 10);
              el("mapa-de").value = semana.toISOString().slice(0, 10);
              preencheMetricas();
              return true;
            });
          }

          function dispositivoAtual() {
            var id = el("device").value;
            return catalogo.filter(function (d) { return d.device_id === id; })[0];
          }

          function preencheMetricas() {
            var d = dispositivoAtual();
            var sel = el("metric");
            sel.innerHTML = "";
            (d ? d.metrics : []).forEach(function (m) {
              var o = document.createElement("option");
              o.value = m.metric;
              o.textContent = m.metric + (m.unit ? " (" + m.unit + ")" : "");
              sel.appendChild(o);
            });
          }

          // ------------------------------------------------------------------ série
          function carregaSerie() {
            var device = el("device").value;
            var metric = el("metric").value;
            if (!device || !metric) return;

            var horas = Number(el("range").value);
            var ate = new Date();
            var de = new Date(ate.getTime() - horas * 3600 * 1000);
            var qs = "?from=" + de.toISOString().replace(/\.\d+Z$/, "Z")
                   + "&to=" + ate.toISOString().replace(/\.\d+Z$/, "Z");

            mostraAviso("Carregando…");
            pegar("/devices/" + encodeURIComponent(device)
                  + "/metrics/" + encodeURIComponent(metric) + qs)
              .then(function (dados) {
                serie = dados.points || [];
                var m = dispositivoAtual();
                var achada = m && m.metrics.filter(function (x) {
                  return x.metric === metric;
                })[0];
                unidade = (achada && achada.unit) || "";
                el("granularidade").textContent =
                  serie.length ? "granularidade " + dados.granularity : "";
                if (!serie.length) {
                  mostraAviso("Sem leituras nesse intervalo.");
                  return;
                }
                el("aviso").hidden = true;
                desenha();
                preencheTiles();
                preencheTabela();
              })
              .catch(function (e) { mostraAviso(e.message, true); });
          }

          // ----------------------------------------------------------------- tiles
          function preencheTiles() {
            var minimos = serie.map(function (p) { return p.min; });
            var maximos = serie.map(function (p) { return p.max; });
            var amostras = serie.reduce(function (a, p) { return a + p.n; }, 0);
            var soma = serie.reduce(function (a, p) { return a + p.avg * p.n; }, 0);
            el("t-min").textContent = comUnidade(Math.min.apply(null, minimos));
            el("t-max").textContent = comUnidade(Math.max.apply(null, maximos));
            el("t-avg").textContent = comUnidade(amostras ? soma / amostras : null);
            el("t-n").textContent = amostras;
            el("t-buckets").textContent = serie.length;
            el("tiles").hidden = false;
          }

          function preencheTabela() {
            var corpo = el("corpo-tabela");
            corpo.innerHTML = "";
            serie.forEach(function (p) {
              var tr = document.createElement("tr");
              [horario(p.t), numero(p.min), numero(p.max), numero(p.avg), p.n]
                .forEach(function (v) {
                  var td = document.createElement("td");
                  td.textContent = v;
                  tr.appendChild(td);
                });
              corpo.appendChild(tr);
            });
          }

          // --------------------------------------------------------------- gráfico
          // Recalculado a cada desenho: em tela estreita o grafico fica mais alto
          // em proporcao, senao vira uma faixa achatada.
          var L, R, T, B, W, H;

          function medeArea() {
            var estreito = window.innerWidth < 700;
            W = estreito ? 420 : 880;
            H = estreito ? 300 : 320;
            L = estreito ? 40 : 52;
            R = estreito ? 12 : 18;
            T = 16;
            B = estreito ? 32 : 34;
            return estreito;
          }

          function escalaBonita(lo, hi) {
            if (lo === hi) { lo -= 1; hi += 1; }
            var passo = Math.pow(10, Math.floor(Math.log10((hi - lo) / 4)));
            [1, 2, 2.5, 5, 10].some(function (f) {
              if ((hi - lo) / (passo * f) <= 5) { passo = passo * f; return true; }
              return false;
            });
            return { lo: Math.floor(lo / passo) * passo,
                     hi: Math.ceil(hi / passo) * passo, passo: passo };
          }

          function svgNo(tag, atributos) {
            var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
            Object.keys(atributos || {}).forEach(function (k) {
              n.setAttribute(k, atributos[k]);
            });
            return n;
          }

          function desenha() {
            var svg = el("grafico");
            var estreito = medeArea();
            svg.setAttribute("viewBox", "0 0 " + W + " " + H);
            svg.innerHTML = "";

            var tempos = serie.map(function (p) { return new Date(p.t).getTime(); });
            var t0 = Math.min.apply(null, tempos), t1 = Math.max.apply(null, tempos);
            var esc = escalaBonita(
              Math.min.apply(null, serie.map(function (p) { return p.min; })),
              Math.max.apply(null, serie.map(function (p) { return p.max; }))
            );

            var x = function (t) {
              return t1 === t0 ? L + (W - L - R) / 2
                : L + ((t - t0) / (t1 - t0)) * (W - L - R);
            };
            var y = function (v) {
              return T + (1 - (v - esc.lo) / (esc.hi - esc.lo)) * (H - T - B);
            };

            // grade + marcas do eixo y, recessivas
            for (var v = esc.lo; v <= esc.hi + esc.passo / 2; v += esc.passo) {
              var yy = y(v);
              svg.appendChild(svgNo("line", { x1: L, x2: W - R, y1: yy, y2: yy,
                                              class: "grade-linha" }));
              var rot = svgNo("text", { x: L - 8, y: yy + 4, "text-anchor": "end",
                                        class: "marca-texto" });
              rot.textContent = numero(v, esc.passo < 1 ? 1 : 0);
              svg.appendChild(rot);
            }

            // Eixo x: primeira e ultima marca sao obrigatorias; no meio entra so o
            // que nao encostar. Comparar distancia entre centros nao basta, porque as
            // pontas sao ancoradas para dentro (senao "middle" corta metade do
            // rotulo no limite do viewBox) e isso desloca a caixa do texto.
            var ultimo = serie.length - 1;
            var FONTE = estreito ? 13 : 11;
            var FOLGA = 10;

            function caixaRotulo(i) {
              var largura = horario(serie[i].t, true).length * FONTE * 0.56;
              var cx = x(tempos[i]);
              if (i === 0) return [cx, cx + largura];
              if (i === ultimo) return [cx - largura, cx];
              return [cx - largura / 2, cx + largura / 2];
            }

            var marcas = [0];
            if (ultimo > 0) {
              var caixaFinal = caixaRotulo(ultimo);
              for (var i = 1; i < ultimo; i++) {
                var atual = caixaRotulo(i);
                var anterior = caixaRotulo(marcas[marcas.length - 1]);
                if (atual[0] - anterior[1] >= FOLGA
                    && caixaFinal[0] - atual[1] >= FOLGA) {
                  marcas.push(i);
                }
              }
              marcas.push(ultimo);
            }

            marcas.forEach(function (i) {
              var ancora = i === 0 ? "start" : (i === ultimo ? "end" : "middle");
              var rot = svgNo("text", { x: x(tempos[i]), y: H - 12,
                                        "text-anchor": ancora, class: "marca-texto" });
              rot.textContent = horario(serie[i].t, true);
              svg.appendChild(rot);
            });
            svg.appendChild(svgNo("line", { x1: L, x2: W - R, y1: y(esc.lo),
                                            y2: y(esc.lo), class: "eixo-linha" }));

            // faixa min-max: mesma entidade da linha, por isso a mesma cor mais clara
            var ida = serie.map(function (p, i) {
              return (i ? "L" : "M") + x(tempos[i]) + " " + y(p.max);
            }).join(" ");
            var volta = serie.slice().reverse().map(function (p, i) {
              var j = serie.length - 1 - i;
              return "L" + x(tempos[j]) + " " + y(p.min);
            }).join(" ");
            svg.appendChild(svgNo("path", { d: ida + " " + volta + " Z",
                                            fill: "var(--serie-faixa)" }));

            // linha da media
            svg.appendChild(svgNo("path", {
              d: serie.map(function (p, i) {
                return (i ? "L" : "M") + x(tempos[i]) + " " + y(p.avg);
              }).join(" "),
              fill: "none", stroke: "var(--serie)", "stroke-width": 2,
              "stroke-linejoin": "round", "stroke-linecap": "round"
            }));

            // marcadores so quando ha espaco para eles respirarem
            if (serie.length <= 40) {
              serie.forEach(function (p, i) {
                svg.appendChild(svgNo("circle", {
                  cx: x(tempos[i]), cy: y(p.avg), r: 4, fill: "var(--serie)",
                  stroke: "var(--superficie)", "stroke-width": 2
                }));
              });
            }

            // rotulo direto so no ultimo ponto, em tinta de texto
            var pontoFinal = serie[ultimo];
            var rotulo = svgNo("text", {
              x: Math.min(x(t1) + 6, W - 4), y: y(pontoFinal.avg) - 10,
              "text-anchor": x(t1) > W - 60 ? "end" : "start", class: "rotulo-direto"
            });
            rotulo.textContent = comUnidade(pontoFinal.avg);
            svg.appendChild(rotulo);

            ligaCursor(svg, tempos, x, y);
          }

          function ligaCursor(svg, tempos, x, y) {
            var cursor = svgNo("line", { class: "cursor", y1: T, y2: H - B,
                                         x1: -99, x2: -99 });
            var alvo = svgNo("circle", { r: 5, fill: "none", stroke: "var(--serie)",
                                         "stroke-width": 2, cx: -99, cy: -99 });
            svg.appendChild(cursor);
            svg.appendChild(alvo);

            var dica = el("dica");
            var area = svg.parentNode;

            function esconde() {
              dica.style.opacity = 0;
              cursor.setAttribute("x1", -99); cursor.setAttribute("x2", -99);
              alvo.setAttribute("cx", -99);
            }

            svg.addEventListener("mouseleave", esconde);
            svg.addEventListener("mousemove", function (evento) {
              var caixa = svg.getBoundingClientRect();
              var px = (evento.clientX - caixa.left) * (W / caixa.width);
              var melhor = 0, dist = Infinity;
              tempos.forEach(function (t, i) {
                var d = Math.abs(x(t) - px);
                if (d < dist) { dist = d; melhor = i; }
              });
              var p = serie[melhor];
              var cx = x(tempos[melhor]);
              cursor.setAttribute("x1", cx); cursor.setAttribute("x2", cx);
              alvo.setAttribute("cx", cx); alvo.setAttribute("cy", y(p.avg));

              dica.innerHTML =
                "<b>" + horario(p.t) + "</b><dl>"
                + "<dt>máx</dt><dd>" + comUnidade(p.max) + "</dd>"
                + "<dt>média</dt><dd>" + comUnidade(p.avg) + "</dd>"
                + "<dt>mín</dt><dd>" + comUnidade(p.min) + "</dd>"
                + "<dt>amostras</dt><dd>" + p.n + "</dd></dl>";
              dica.style.opacity = 1;
              var escala = caixa.width / W;
              var esquerda = cx * escala + 14;
              if (esquerda + dica.offsetWidth > caixa.width) {
                esquerda = cx * escala - dica.offsetWidth - 14;
              }
              dica.style.left = Math.max(0, esquerda) + "px";
              dica.style.top = Math.max(0, y(p.avg) * escala - 10) + "px";
            });
          }


          // ==========================================================================
          // Mapa de permanencia
          //
          // Sem basemap de proposito: um provedor de tiles seria dependencia externa e,
          // para imagem de satelite, chave paga. Para um talhao as celulas ja desenham
          // o formato do campo. A projecao e o hit-test estao isolados, entao uma
          // camada de tiles entra por baixo depois sem mexer no resto.
          // ==========================================================================

          // Rampa sequencial de um unico matiz (claro -> escuro no tema claro).
          // No escuro ela inverte: quem tem que recuar em direcao a superficie e o
          // valor baixo, e no fundo escuro isso e a ponta escura da rampa.
          var RAMPA = ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5",
                       "#256abf", "#184f95", "#0d366b"];

          var mapa = { celulas: [], tamanho: null, celulaPai: null, geometria: null };

          function temaEscuro() {
            var marcado = document.documentElement.getAttribute("data-theme");
            return marcado ? marcado === "dark"
                           : matchMedia("(prefers-color-scheme: dark)").matches;
          }

          function rampa() {
            return temaEscuro() ? RAMPA.slice().reverse() : RAMPA;
          }

          function duracao(segundos) {
            if (segundos < 60) return Math.round(segundos) + " s";
            if (segundos < 3600) return Math.round(segundos / 60) + " min";
            var horas = Math.floor(segundos / 3600);
            var minutos = Math.round((segundos % 3600) / 60);
            return horas + " h " + (minutos ? minutos + " min" : "");
          }

          function distancia(metros) {
            return metros < 1000 ? Math.round(metros) + " m"
                                 : (metros / 1000).toFixed(1) + " km";
          }

          function avisoMapa(texto, erro) {
            var a = el("mapa-aviso");
            a.textContent = texto;
            a.className = erro ? "aviso erro" : "aviso";
            a.hidden = false;
            el("mapa-tiles").hidden = true;
            el("escala").hidden = true;
            var tela = el("tela-mapa");
            var ctx = tela.getContext("2d");
            ctx.clearRect(0, 0, tela.width, tela.height);
          }

          // Quebras por quantil, nao lineares: a distribuicao de permanencia e muito
          // assimetrica -- quase toda celula tem poucos segundos e umas poucas
          // concentram o trabalho. Escala linear pintaria o campo inteiro de uma cor.
          function quebras(valores, faixas) {
            var ordenado = valores.slice().sort(function (a, b) { return a - b; });
            var saida = [];
            for (var i = 1; i < faixas; i++) {
              saida.push(ordenado[Math.floor(ordenado.length * i / faixas)]);
            }
            return saida;
          }

          function corDaCelula(segundos, cortes, cores) {
            var i = 0;
            while (i < cortes.length && segundos > cortes[i]) i++;
            return cores[i];
          }

          function carregaMapa() {
            var device = el("mapa-device").value;
            if (!device) return;
            var de = el("mapa-de").value, ate = el("mapa-ate").value;
            if (!de || !ate) return;

            var qs = "?from=" + de + "&to=" + ate
                   + (mapa.celulaPai ? "&cell=" + encodeURIComponent(mapa.celulaPai) : "");
            avisoMapa("Carregando…");
            pegar("/devices/" + encodeURIComponent(device) + "/heatmap" + qs)
              .then(function (dados) {
                mapa.celulas = dados.cells || [];
                mapa.tamanho = dados.cellSize;
                mapa.precisao = dados.precision;
                if (!mapa.celulas.length) {
                  avisoMapa(mapa.celulaPai
                    ? "Sem detalhe nessa célula no período."
                    : "Sem posições nesse período. O Glue Job popula o mapa na "
                      + "primeira execução depois da chegada dos dados.");
                  atualizaTrilha();
                  return;
                }
                el("mapa-aviso").hidden = true;
                desenhaMapa();
                preencheTilesMapa();
                atualizaTrilha();
              })
              .catch(function (e) { avisoMapa(e.message, true); });
          }

          function atualizaTrilha() {
            var t = el("trilha");
            if (mapa.celulaPai) {
              t.innerHTML = "";
              t.appendChild(document.createTextNode(
                "detalhe de " + mapa.celulaPai + " · célula ~5 m  "));
              var voltar = document.createElement("button");
              voltar.textContent = "voltar à visão geral";
              voltar.addEventListener("click", function () {
                mapa.celulaPai = null;
                carregaMapa();
              });
              t.appendChild(voltar);
            } else {
              t.textContent = mapa.celulas.length
                ? "visão geral · célula ~153 m · clique numa célula para o detalhe"
                : "";
            }
          }

          function preencheTilesMapa() {
            var segundos = mapa.celulas.reduce(function (a, c) { return a + c.secs; }, 0);
            var metros = mapa.celulas.reduce(function (a, c) { return a + c.dist_m; }, 0);
            // Area da celula em m2, corrigida pela latitude.
            var lat = mapa.celulas[0].lat;
            var mLat = mapa.tamanho.lat * 111320;
            var mLon = mapa.tamanho.lon * 111320 * Math.cos(lat * Math.PI / 180);
            var area = mapa.celulas.length * mLat * mLon;

            el("m-tempo").textContent = duracao(segundos);
            el("m-dist").textContent = distancia(metros);
            el("m-vel").textContent = segundos
              ? (metros / segundos * 3.6).toFixed(1) + " km/h" : "—";
            el("m-area").textContent = area > 10000
              ? (area / 10000).toFixed(1) + " ha" : Math.round(area) + " m²";
            // A resolucao vai no rotulo de proposito: na celula de 153 m a area
            // superestima muito, porque a celula conta inteira mesmo quando o trator
            // so cruzou um canto dela. So na celula fina isso vira cobertura de fato.
            el("m-area-rotulo").textContent =
              "Área · célula ~" + (mapa.precisao === 9 ? "5 m" : "153 m");
            el("m-celulas").textContent = mapa.celulas.length;
            el("mapa-tiles").hidden = false;
          }

          function desenhaMapa() {
            var tela = el("tela-mapa");
            var largura = tela.clientWidth || 880;
            var altura = Math.round(Math.min(560, Math.max(320, largura * 0.62)));
            var escala = window.devicePixelRatio || 1;
            tela.width = largura * escala;
            tela.height = altura * escala;
            tela.style.height = altura + "px";
            var ctx = tela.getContext("2d");
            ctx.setTransform(escala, 0, 0, escala, 0, 0);
            ctx.clearRect(0, 0, largura, altura);

            var dLat = mapa.tamanho.lat, dLon = mapa.tamanho.lon;
            var lats = mapa.celulas.map(function (c) { return c.lat; });
            var lons = mapa.celulas.map(function (c) { return c.lon; });
            var lat0 = Math.min.apply(null, lats) - dLat / 2;
            var lat1 = Math.max.apply(null, lats) + dLat / 2;
            var lon0 = Math.min.apply(null, lons) - dLon / 2;
            var lon1 = Math.max.apply(null, lons) + dLon / 2;

            // Equirretangular com correcao de cosseno: sem ela a celula sai achatada
            // e o formato do talhao mente.
            var k = Math.cos((lat0 + lat1) / 2 * Math.PI / 180);
            var margem = 12;
            var mundoL = (lon1 - lon0) * k, mundoA = lat1 - lat0;
            var fator = Math.min((largura - 2 * margem) / mundoL,
                                 (altura - 2 * margem) / mundoA);
            var offX = (largura - mundoL * fator) / 2;
            var offY = (altura - mundoA * fator) / 2;

            var paraX = function (lon) { return offX + (lon - lon0) * k * fator; };
            var paraY = function (lat) { return offY + (lat1 - lat) * fator; };

            var cores = rampa();
            var cortes = quebras(mapa.celulas.map(function (c) { return c.secs; }),
                                 cores.length);

            mapa.celulas.forEach(function (c) {
              var x = paraX(c.lon - dLon / 2), y = paraY(c.lat + dLat / 2);
              var l = Math.max(1, dLon * k * fator), a = Math.max(1, dLat * fator);
              ctx.fillStyle = corDaCelula(c.secs, cortes, cores);
              ctx.fillRect(x, y, Math.ceil(l), Math.ceil(a));
            });

            mapa.geometria = { paraX: paraX, paraY: paraY, fator: fator, k: k,
                               lat0: lat0, lat1: lat1, lon0: lon0, dLat: dLat,
                               dLon: dLon, offX: offX, offY: offY };
            indexa();
            desenhaEscala(cores, cortes);
          }

          function desenhaEscala(cores, cortes) {
            var faixa = el("escala-faixa");
            faixa.innerHTML = "";
            cores.forEach(function (cor) {
              var i = document.createElement("i");
              i.style.background = cor;
              faixa.appendChild(i);
            });
            var maximo = Math.max.apply(null, mapa.celulas.map(function (c) {
              return c.secs;
            }));
            el("escala-limites").textContent =
              "· mediana " + duracao(cortes[Math.floor(cortes.length / 2)])
              + ", máximo " + duracao(maximo);
            el("escala").hidden = false;
          }

          // Hit-test por aritmetica, nao por evento em cada retangulo: as celulas
          // formam uma grade regular em lat/lon, entao da para ir da coordenada do
          // mouse direto ao indice da celula.
          function celulaEm(clientX, clientY) {
            var g = mapa.geometria;
            if (!g) return null;
            var caixa = el("tela-mapa").getBoundingClientRect();
            var px = clientX - caixa.left, py = clientY - caixa.top;
            var lon = g.lon0 + (px - g.offX) / (g.k * g.fator);
            var lat = g.lat1 - (py - g.offY) / g.fator;
            var iLat = Math.round((lat + 90) / g.dLat - 0.5);
            var iLon = Math.round((lon + 180) / g.dLon - 0.5);
            return mapa.indice[iLat + "_" + iLon] || null;
          }

          function indexa() {
            mapa.indice = {};
            var dLat = mapa.tamanho.lat, dLon = mapa.tamanho.lon;
            mapa.celulas.forEach(function (c) {
              var iLat = Math.round((c.lat + 90) / dLat - 0.5);
              var iLon = Math.round((c.lon + 180) / dLon - 0.5);
              mapa.indice[iLat + "_" + iLon] = c;
            });
          }

          el("tela-mapa").addEventListener("mousemove", function (evento) {
            var dica = el("dica-mapa");
            var c = celulaEm(evento.clientX, evento.clientY);
            if (!c) { dica.style.opacity = 0; return; }
            var vel = c.secs ? (c.dist_m / c.secs * 3.6).toFixed(1) + " km/h" : "—";
            dica.innerHTML = "<b>" + c.gh + "</b><dl>"
              + "<dt>permanência</dt><dd>" + duracao(c.secs) + "</dd>"
              + "<dt>distância</dt><dd>" + distancia(c.dist_m) + "</dd>"
              + "<dt>velocidade</dt><dd>" + vel + "</dd>"
              + "<dt>fixes</dt><dd>" + c.n + "</dd></dl>";
            dica.style.opacity = 1;
            var caixa = el("tela-mapa").getBoundingClientRect();
            var esquerda = evento.clientX - caixa.left + 14;
            if (esquerda + dica.offsetWidth > caixa.width) {
              esquerda = evento.clientX - caixa.left - dica.offsetWidth - 14;
            }
            dica.style.left = Math.max(0, esquerda) + "px";
            dica.style.top = Math.max(0, evento.clientY - caixa.top - 10) + "px";
          });

          el("tela-mapa").addEventListener("mouseleave", function () {
            el("dica-mapa").style.opacity = 0;
          });

          el("tela-mapa").addEventListener("click", function (evento) {
            if (mapa.celulaPai) return;             // ja esta no detalhe
            var c = celulaEm(evento.clientX, evento.clientY);
            if (!c) return;
            mapa.celulaPai = c.gh;
            carregaMapa();
          });

          function trocaVista(paraMapa) {
            el("vista-serie").hidden = paraMapa;
            el("vista-mapa").hidden = !paraMapa;
            el("aba-serie").setAttribute("aria-pressed", String(!paraMapa));
            el("aba-mapa").setAttribute("aria-pressed", String(paraMapa));
            if (paraMapa && !mapa.celulas.length) carregaMapa();
          }

          el("aba-serie").addEventListener("click", function () { trocaVista(false); });
          el("aba-mapa").addEventListener("click", function () { trocaVista(true); });
          el("mapa-device").addEventListener("change", function () {
            mapa.celulaPai = null; carregaMapa();
          });
          el("mapa-de").addEventListener("change", carregaMapa);
          el("mapa-ate").addEventListener("change", carregaMapa);
          el("mapa-recarregar").addEventListener("click", carregaMapa);

          // ---------------------------------------------------------------- eventos
          el("device").addEventListener("change", function () {
            preencheMetricas(); carregaSerie();
          });
          el("metric").addEventListener("change", carregaSerie);
          el("range").addEventListener("change", carregaSerie);
          el("recarregar").addEventListener("click", carregaSerie);

          el("alterna-tabela").addEventListener("click", function () {
            var mostrando = el("envelope-tabela").hidden;
            el("envelope-tabela").hidden = !mostrando;
            this.setAttribute("aria-pressed", String(mostrando));
            this.textContent = mostrando ? "Ocultar tabela" : "Ver tabela";
          });

          el("tema").addEventListener("click", function () {
            var atual = document.documentElement.getAttribute("data-theme");
            var escuro = atual
              ? atual === "dark"
              : matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.setAttribute("data-theme", escuro ? "light" : "dark");
            if (serie.length) desenha();
            if (mapa.celulas.length) desenhaMapa();
          });

          window.addEventListener("resize", function () {
            if (serie.length) desenha();
            if (mapa.celulas.length && !el("vista-mapa").hidden) desenhaMapa();
          });

          // ----------------------------------------------------------------- início
          fetch("config.json")
            .then(function (r) { return r.json(); })
            .then(function (cfg) {
              API = String(cfg.apiBase).replace(/\/$/, "");
              return carregaCatalogo();
            })
            .then(function (ok) { if (ok) carregaSerie(); })
            .catch(function (e) { mostraAviso(e.message, true); });
        })();
        </script>
        </body>
        </html>
  # A URL da API entra aqui, e nao dentro do HTML, para o index.html do
  # repositorio ser identico ao publicado -- o que permite a checagem de
  # divergencia em scripts/check_embedded_script.py.
  FrontendConfig:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt ScriptWriterFunction.Arn
      Bucket: !Ref SiteBucket
      Key: config.json
      ContentType: application/json
      CacheControl: 'public, max-age=60'
      Content: !Sub '{"apiBase": "${RollupApi.ApiEndpoint}"}'

Outputs:

  IoTRuleName:
    Description: >
      Nome da regra. Para basic ingest, publique em
      $aws/rules/<este-nome> e pule a cobranca de mensageria do broker.
    Value: !Ref TelemetryTopicRule

  PositionRuleName:
    Description: >
      Regra de posicao. Para basic ingest, o trator publica em
      $aws/rules/<este-nome>.
    Value: !Ref PositionTopicRule

  DeliveryStreamName:
    Value: !Ref TelemetryDeliveryStream

  RawTable:
    Description: Tabela Iceberg com o dado bruto.
    Value: !Sub '${GlueDatabase}.telemetry_raw'

  RollupTableName:
    Description: Tabela DynamoDB consultada pelo frontend.
    Value: !Ref RollupTable

  DataBucket:
    Value: !Ref DataBucket

  ApiEndpoint:
    Description: Base da API de leitura consumida pelo frontend.
    Value: !GetAtt RollupApi.ApiEndpoint

  ApiExemplo:
    Description: Chamada de exemplo (ajuste device, metrica e o intervalo).
    Value: !Sub >-
      ${RollupApi.ApiEndpoint}/devices/sensor-teste/metrics/temperature?from=2026-08-26T00:00:00Z&to=2026-08-27T00:00:00Z

  SiteUrl:
    Description: Dashboard servido pelo CloudFront.
    Value: !Sub 'https://${SiteDistribution.DomainName}'
