AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Pipeline de ingestao IoT: IoT Core (MQTT) -> Amazon Data Firehose ->
  tabela Apache Iceberg no Glue Data Catalog -> Glue Job de agregacao ->
  DynamoDB (rollups servidos ao frontend).

# ATENCAO: arquivo GERADO por build/assemble.py -- nao edite aqui.
# As fontes estao em infra/ (fragmentos YAML), lambdas/, glue/ e frontend/.
# Depois de mexer em qualquer uma delas, rode: make build

Parameters:

  ProjectName:
    Type: String
    Default: iot-telemetry
    AllowedPattern: '[a-z0-9-]+'
    Description: Prefixo usado no nome dos recursos.

  DataBucketName:
    Type: String
    Default: ''
    MaxLength: 63
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: >
      Vazio, ou um nome de bucket S3 valido: 3 a 63 caracteres, apenas
      minusculas, digitos, ponto e hifen, comecando e terminando com letra ou
      digito. Maiuscula e underscore sao rejeitados pelo S3.
    Description: >
      Nome do bucket S3 criado por esta pilha (warehouse Iceberg, erros do
      Firehose e script do Glue Job). Deixe vazio para a pilha derivar
      '<ProjectName>-data-<account-id>-<regiao>', que ja e globalmente unico.
      Preencha apenas para reaproveitar um nome especifico.

  MqttTopicFilter:
    Type: String
    Default: 'devices/+/telemetry'
    Description: >
      Filtro de topico da regra do IoT Core. Para basic ingest, o device
      publica em $aws/rules/<RuleName> e este filtro passa a ser ignorado.

  PositionTopicFilter:
    Type: String
    Default: 'devices/+/position'
    Description: >
      Filtro de topico da regra de posicao. Caminho separado do de telemetria
      porque o formato do registro e outro.

  PositionSampleSeconds:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 300
    Description: >
      Intervalo nominal entre fixes de GPS. Usado como teto do dt na conta de
      permanencia: sem ele, um trator desligado a noite doaria horas para a
      celula onde estacionou.

  RollupLookbackHours:
    Type: Number
    Default: 3
    Description: >
      Janela retroativa reprocessada a cada execucao do Glue Job. Cobre
      chegada tardia de dados (device offline que sobe batch acumulado).

  HotStoreTtlDays:
    Type: Number
    Default: 45
    Description: Retencao dos rollups no DynamoDB antes do TTL expirar o item.

  ApiCorsOrigin:
    Type: String
    Default: '*'
    Description: >
      Origem aceita pelo CORS da API de leitura. '*' serve para teste; em
      producao aponte para o dominio do frontend.

  FirehoseBufferSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 900
    Description: Intervalo de buffer do Firehose antes de escrever no Iceberg.

Conditions:

  # Nome de bucket e globalmente unico; account id + regiao resolvem isso sem
  # exigir que quem faz o deploy invente um nome.
  DerivarNomeDoBucket: !Equals [!Ref DataBucketName, '']

Resources:

  # ---------------------------------------------------------------------------
  # Armazenamento
  # ---------------------------------------------------------------------------

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - DerivarNomeDoBucket
        - !Sub '${ProjectName}-data-${AWS::AccountId}-${AWS::Region}'
        - !Ref DataBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expira-erros-do-firehose
            Status: Enabled
            Prefix: errors/
            ExpirationInDays: 30
          - Id: aborta-multipart-incompleto
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # ---------------------------------------------------------------------------
  # Glue Data Catalog - database e tabela Iceberg (dado bruto)
  # ---------------------------------------------------------------------------

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        # Hifen fora: o Firehose exige [a-zA-Z0-9._]+ em
        # destinationDatabaseName, entao 'iot-telemetry_db' quebraria a
        # criacao do delivery stream. Mesmo tratamento dado ao nome da regra
        # do IoT Core mais abaixo.
        Name: !Sub
          - '${Name}_db'
          - Name: !Join ['_', !Split ['-', !Ref ProjectName]]
        Description: Telemetria de dispositivos IoT.

  TelemetryRawTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      OpenTableFormatInput:
        IcebergInput:
          MetadataOperation: CREATE
          Version: '2'
      TableInput:
        Name: telemetry_raw
        TableType: EXTERNAL_TABLE
        # table_type e metadata_location sao reservados: o IcebergInput acima
        # os define, e o Glue rejeita a criacao se vierem declarados aqui.
        Parameters:
          format: parquet
          write.parquet.compression-codec: zstd
        StorageDescriptor:
          Location: !Sub 's3://${DataBucket}/warehouse/telemetry_raw/'
          Columns:
            - Name: device_id
              Type: string
              Comment: Identificador do dispositivo (enviado dentro de cada leitura).
            - Name: event_time
              Type: timestamp
              Comment: Momento da medicao no device (ISO-8601 UTC).
            - Name: ingested_at
              Type: timestamp
              Comment: Momento em que o Firehose recebeu o registro.
            - Name: metric
              Type: string
              Comment: Nome da grandeza medida (ex. temperature, humidity).
            - Name: value
              Type: double
            - Name: unit
              Type: string
            - Name: batch_id
              Type: string
              Comment: Id do lote enviado pelo device, usado para deduplicacao.
            - Name: seq
              Type: int
              Comment: Sequencia da leitura dentro do lote.

  # Compaction + expiracao de snapshots gerenciadas pelo Glue.
  # Sem isso, entregas de 5 em 5 minutos viram milhares de arquivos pequenos.
  TelemetryCompaction:
    Type: AWS::Glue::TableOptimizer
    DependsOn: TelemetryRawTable
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableName: telemetry_raw
      Type: compaction
      TableOptimizerConfiguration:
        Enabled: true
        RoleArn: !GetAtt TableOptimizerRole.Arn

  TelemetrySnapshotRetention:
    Type: AWS::Glue::TableOptimizer
    DependsOn: TelemetryCompaction
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableName: telemetry_raw
      Type: retention
      TableOptimizerConfiguration:
        Enabled: true
        RoleArn: !GetAtt TableOptimizerRole.Arn
        RetentionConfiguration:
          IcebergConfiguration:
            SnapshotRetentionPeriodInDays: 7
            NumberOfSnapshotsToRetain: 10
            CleanExpiredFiles: true

  TableOptimizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: otimiza-tabela-iceberg
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - glue:GetTable
                  - glue:UpdateTable
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabase}'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabase}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*'

  # ---------------------------------------------------------------------------
  # Posicao dos tratores - tabela Iceberg propria
  #
  # Nao entra em telemetry_raw porque o formato e outro: uma leitura escalar
  # tem (metric, value); uma posicao e um par (lat, lon) que so significa
  # alguma coisa junto. Separar em duas metricas destruiria o pareamento, e com
  # ele distancia, velocidade e o proprio ponto no mapa.
  # ---------------------------------------------------------------------------

  PositionsRawTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      OpenTableFormatInput:
        IcebergInput:
          MetadataOperation: CREATE
          Version: '2'
      TableInput:
        Name: positions_raw
        TableType: EXTERNAL_TABLE
        Parameters:
          format: parquet
          write.parquet.compression-codec: zstd
        StorageDescriptor:
          Location: !Sub 's3://${DataBucket}/warehouse/positions_raw/'
          Columns:
            - Name: device_id
              Type: string
            - Name: event_time
              Type: timestamp
              Comment: Momento do fix de GPS no device (ISO-8601 UTC).
            - Name: ingested_at
              Type: timestamp
            - Name: lat
              Type: double
            - Name: lon
              Type: double
            - Name: speed
              Type: double
              Comment: Opcional. O job deriva velocidade de distancia/tempo.
            - Name: heading
              Type: double
            - Name: altitude
              Type: double
            - Name: batch_id
              Type: string
            - Name: seq
              Type: int
              Comment: Unico no lote inteiro, nao por campo.

  PositionsCompaction:
    Type: AWS::Glue::TableOptimizer
    DependsOn: PositionsRawTable
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableName: positions_raw
      Type: compaction
      TableOptimizerConfiguration:
        Enabled: true
        RoleArn: !GetAtt TableOptimizerRole.Arn

  PositionsSnapshotRetention:
    Type: AWS::Glue::TableOptimizer
    DependsOn: PositionsCompaction
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableName: positions_raw
      Type: retention
      TableOptimizerConfiguration:
        Enabled: true
        RoleArn: !GetAtt TableOptimizerRole.Arn
        RetentionConfiguration:
          IcebergConfiguration:
            SnapshotRetentionPeriodInDays: 7
            NumberOfSnapshotsToRetain: 10
            CleanExpiredFiles: true

  # ---------------------------------------------------------------------------
  # Lambda de transformacao do Firehose
  # Recebe UMA leitura por invocacao (o batchMode da regra IoT ja separou o
  # array) e carimba o horario de ingestao. Transformacao no Firehose e 1:1 -
  # nao da para explodir um registro em varios aqui, por isso o fan-out do
  # lote acontece na regra do IoT Core.
  # ---------------------------------------------------------------------------

  TransformFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-firehose-transform'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TransformFunctionRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        ZipFile: |
          import base64
          import json
          from datetime import datetime, timezone

          REQUIRED = ("device_id", "event_time", "metric", "value")

          def handler(event, context):
              now = datetime.now(timezone.utc).isoformat(timespec="milliseconds")
              out = []
              for rec in event["records"]:
                  try:
                      payload = json.loads(base64.b64decode(rec["data"]))
                      if any(payload.get(f) is None for f in REQUIRED):
                          out.append({"recordId": rec["recordId"],
                                      "result": "ProcessingFailed"})
                          continue
                      payload["ingested_at"] = now
                      payload["value"] = float(payload["value"])
                      if payload.get("seq") is not None:
                          payload["seq"] = int(payload["seq"])
                      data = base64.b64encode(
                          json.dumps(payload).encode("utf-8")
                      ).decode("utf-8")
                      out.append({"recordId": rec["recordId"],
                                  "result": "Ok",
                                  "data": data})
                  except Exception:
                      out.append({"recordId": rec["recordId"],
                                  "result": "ProcessingFailed"})
              return {"records": out}
  TransformFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  # ---------------------------------------------------------------------------
  # Amazon Data Firehose -> Iceberg
  # ---------------------------------------------------------------------------

  FirehoseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/kinesisfirehose/${ProjectName}'
      RetentionInDays: 14

  FirehoseLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref FirehoseLogGroup
      LogStreamName: iceberg-delivery

  TelemetryDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    DependsOn: TelemetryRawTable
    Properties:
      DeliveryStreamName: !Sub '${ProjectName}-to-iceberg'
      DeliveryStreamType: DirectPut
      IcebergDestinationConfiguration:
        RoleARN: !GetAtt FirehoseRole.Arn
        # Telemetria e insert-only. AppendOnly=true libera o Firehose a
        # escalar o throughput automaticamente.
        AppendOnly: true
        CatalogConfiguration:
          CatalogArn: !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
        DestinationTableConfigurationList:
          - DestinationDatabaseName: !Ref GlueDatabase
            DestinationTableName: telemetry_raw
        BufferingHints:
          IntervalInSeconds: !Ref FirehoseBufferSeconds
          SizeInMBs: 128
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Lambda
              Parameters:
                - ParameterName: LambdaArn
                  ParameterValue: !GetAtt TransformFunction.Arn
                - ParameterName: BufferIntervalInSeconds
                  ParameterValue: '60'
                - ParameterName: BufferSizeInMBs
                  ParameterValue: '3'
        RetryOptions:
          DurationInSeconds: 300
        s3BackupMode: FailedDataOnly
        S3Configuration:
          RoleARN: !GetAtt FirehoseRole.Arn
          BucketARN: !GetAtt DataBucket.Arn
          Prefix: 'errors/'
          ErrorOutputPrefix: 'errors/!{firehose:error-output-type}/'
          BufferingHints:
            IntervalInSeconds: 300
            SizeInMBs: 5
          CompressionFormat: GZIP
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseLogGroup
          LogStreamName: !Ref FirehoseLogStream

  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref AWS::AccountId
      Policies:
        - PolicyName: entrega-iceberg
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - glue:GetTable
                  - glue:GetDatabase
                  - glue:UpdateTable
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabase}'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabase}/*'
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:GetFunctionConfiguration
                Resource:
                  - !GetAtt TransformFunction.Arn
                  - !GetAtt PositionTransformFunction.Arn
              - Effect: Allow
                Action: logs:PutLogEvents
                Resource:
                  - !GetAtt FirehoseLogGroup.Arn
                  - !GetAtt PositionLogGroup.Arn

  # ---------------------------------------------------------------------------
  # Caminho de ingestao das posicoes - paralelo ao da telemetria
  #
  # Stream separado de proposito: o caminho da telemetria ja esta em producao e
  # nao precisa ser tocado para a posicao existir. Delivery stream parado nao
  # custa (cobranca por GB), entao o paralelismo sai de graca.
  # ---------------------------------------------------------------------------

  PositionTransformFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-position-transform'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt PositionTransformRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref RollupTable
          TTL_DAYS: !Ref HotStoreTtlDays
      Code:
        ZipFile: |
          import base64
          import json
          import os
          from datetime import datetime, timedelta, timezone

          import boto3

          TABELA = boto3.resource("dynamodb").Table(os.environ["TABLE"])
          TTL_DIAS = int(os.environ["TTL_DAYS"])

          # lat/lon sao obrigatorios e precisam vir PAREADOS na mesma leitura: distancia,
          # velocidade e a propria celula do mapa dependem do par, e nenhum deles se
          # reconstroi se os dois virarem registros separados.
          REQUIRED = ("device_id", "event_time", "lat", "lon")
          OPCIONAIS_FLOAT = ("speed", "heading", "altitude")


          def grava_dynamo(validos):
              """Rastro (TRACK) e ultima posicao (LATEST) em tempo quase real.

              O Iceberg continua sendo a fonte historica completa; estas linhas servem
              a API do argus (latest e paginacao do track) sem esperar o job horario.
              Escrita idempotente por (pk, sk): retry do Firehose sobrescreve igual.
              """
              from decimal import Decimal
              expira = int((datetime.now(timezone.utc)
                            + timedelta(days=TTL_DIAS)).timestamp())
              ultimos = {}
              with TABELA.batch_writer(overwrite_by_pkeys=["pk", "sk"]) as lote:
                  for p in validos:
                      item = {"ts": p["event_time"],
                              "lat": Decimal(str(p["lat"])),
                              "lon": Decimal(str(p["lon"])),
                              "received_at": p["ingested_at"][:19] + "Z",
                              "expires_at": expira}
                      for campo in ("speed", "heading"):
                          if p.get(campo) is not None:
                              item[campo] = Decimal(str(p[campo]))
                      lote.put_item(Item=dict(
                          item, pk=f"TRACK#{p['device_id']}",
                          sk=f"{p['event_time']}#{int(p.get('seq') or 0):06d}"))
                      atual = ultimos.get(p["device_id"])
                      if not atual or p["event_time"] > atual["ts"]:
                          ultimos[p["device_id"]] = item
                  for device, item in ultimos.items():
                      lote.put_item(Item=dict(
                          item, pk=f"DEV#{device}#position", sk="LATEST",
                          at=item["ts"]))


          def handler(event, context):
              now = datetime.now(timezone.utc).isoformat(timespec="milliseconds")
              out = []
              validos = []
              for rec in event["records"]:
                  try:
                      payload = json.loads(base64.b64decode(rec["data"]))
                      if any(payload.get(f) is None for f in REQUIRED):
                          out.append({"recordId": rec["recordId"],
                                      "result": "ProcessingFailed"})
                          continue
                      lat = float(payload["lat"])
                      lon = float(payload["lon"])
                      if not (-90.0 <= lat <= 90.0 and -180.0 <= lon <= 180.0):
                          # Coordenada fora do globo costuma ser fix de GPS invalido
                          # (0,0 e o classico). Deixar entrar sujaria o heatmap com uma
                          # celula no golfo da Guine.
                          out.append({"recordId": rec["recordId"],
                                      "result": "ProcessingFailed"})
                          continue
                      payload["lat"] = lat
                      payload["lon"] = lon
                      payload["ingested_at"] = now
                      for campo in OPCIONAIS_FLOAT:
                          if payload.get(campo) is not None:
                              payload[campo] = float(payload[campo])
                      if payload.get("seq") is not None:
                          payload["seq"] = int(payload["seq"])
                      data = base64.b64encode(
                          json.dumps(payload).encode("utf-8")
                      ).decode("utf-8")
                      out.append({"recordId": rec["recordId"],
                                  "result": "Ok",
                                  "data": data})
                      validos.append(payload)
                  except Exception:
                      out.append({"recordId": rec["recordId"],
                                  "result": "ProcessingFailed"})
              if validos:
                  grava_dynamo(validos)
              return {"records": out}

  # Role propria porque, alem de transformar, esta funcao grava o rastro
  # (TRACK) e a ultima posicao (LATEST) no DynamoDB em tempo quase real --
  # e o que alimenta /api/locations sem esperar o job horario.
  PositionTransformRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: grava-rastro
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchWriteItem
                  - dynamodb:PutItem
                Resource: !GetAtt RollupTable.Arn

  PositionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/kinesisfirehose/${ProjectName}-positions'
      RetentionInDays: 14

  PositionLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref PositionLogGroup
      LogStreamName: iceberg-delivery

  PositionDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    DependsOn: PositionsRawTable
    Properties:
      DeliveryStreamName: !Sub '${ProjectName}-positions-to-iceberg'
      DeliveryStreamType: DirectPut
      IcebergDestinationConfiguration:
        RoleARN: !GetAtt FirehoseRole.Arn
        AppendOnly: true
        CatalogConfiguration:
          CatalogArn: !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
        DestinationTableConfigurationList:
          - DestinationDatabaseName: !Ref GlueDatabase
            DestinationTableName: positions_raw
        BufferingHints:
          IntervalInSeconds: !Ref FirehoseBufferSeconds
          SizeInMBs: 128
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Lambda
              Parameters:
                - ParameterName: LambdaArn
                  ParameterValue: !GetAtt PositionTransformFunction.Arn
                - ParameterName: BufferIntervalInSeconds
                  ParameterValue: '60'
                - ParameterName: BufferSizeInMBs
                  ParameterValue: '3'
        RetryOptions:
          DurationInSeconds: 300
        s3BackupMode: FailedDataOnly
        S3Configuration:
          RoleARN: !GetAtt FirehoseRole.Arn
          BucketARN: !GetAtt DataBucket.Arn
          Prefix: 'errors/'
          ErrorOutputPrefix: 'errors/!{firehose:error-output-type}/'
          BufferingHints:
            IntervalInSeconds: 300
            SizeInMBs: 5
          CompressionFormat: GZIP
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref PositionLogGroup
          LogStreamName: !Ref PositionLogStream

  # ---------------------------------------------------------------------------
  # IoT Core - regra que joga a telemetria no Firehose
  #
  # Contrato do payload publicado pelo device:
  #   { "readings": [
  #       {"device_id":"abc","event_time":"2026-08-26T14:00:00Z",
  #        "metric":"temperature","value":23.4,"unit":"C",
  #        "batch_id":"b-778","seq":0}, ... ] }
  #
  # SELECT VALUE readings + BatchMode: true faz cada elemento do array virar
  # um registro no PutRecordBatch (teto de 500 por chamada). Por isso cada
  # leitura precisa carregar o proprio device_id: depois do fan-out a
  # informacao do topico nao existe mais.
  # ---------------------------------------------------------------------------

  TelemetryTopicRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub
        - '${Name}_telemetry'
        - Name: !Join ['_', !Split ['-', !Ref ProjectName]]
      TopicRulePayload:
        Description: Encaminha lotes de telemetria para o Firehose.
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql: !Sub "SELECT VALUE readings FROM '${MqttTopicFilter}'"
        Actions:
          - Firehose:
              DeliveryStreamName: !Ref TelemetryDeliveryStream
              RoleArn: !GetAtt IoTRuleRole.Arn
              BatchMode: true
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref IoTRuleErrorLogGroup
            RoleArn: !GetAtt IoTRuleRole.Arn

  IoTRuleErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/iot/${ProjectName}/rule-errors'
      RetentionInDays: 14

  IoTRuleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: publica-no-firehose
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource:
                  - !GetAtt TelemetryDeliveryStream.Arn
                  - !GetAtt PositionDeliveryStream.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !GetAtt IoTRuleErrorLogGroup.Arn

  # ---------------------------------------------------------------------------
  # IoT Core - regra que joga as posicoes no Firehose
  #
  #   { "positions": [
  #       {"device_id":"trator-01","event_time":"2026-08-27T14:00:00Z",
  #        "lat":-23.5505,"lon":-46.6333,"speed":8.2,"heading":137,
  #        "batch_id":"b-1","seq":0}, ... ] }
  #
  # Mesmo fan-out por BatchMode da regra de telemetria: cada elemento do array
  # vira um registro. A 1 fix a cada 5 s, um lote por minuto tem 12 elementos,
  # bem abaixo do teto de 500 por chamada.
  # ---------------------------------------------------------------------------

  PositionTopicRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub
        - '${Name}_position'
        - Name: !Join ['_', !Split ['-', !Ref ProjectName]]
      TopicRulePayload:
        Description: Encaminha lotes de posicao para o Firehose.
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql: !Sub "SELECT VALUE positions FROM '${PositionTopicFilter}'"
        Actions:
          - Firehose:
              DeliveryStreamName: !Ref PositionDeliveryStream
              RoleArn: !GetAtt IoTRuleRole.Arn
              BatchMode: true
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref IoTRuleErrorLogGroup
            RoleArn: !GetAtt IoTRuleRole.Arn

  # ---------------------------------------------------------------------------
  # DynamoDB - rollups servidos ao frontend
  #
  # pk = DEV#<device_id>#<metric>
  # sk = AGG#<granularidade>#<inicio_do_bucket>   ex. AGG#1h#2026-08-26T14
  # Uma Query com between no sk devolve a serie pronta para o grafico.
  # ---------------------------------------------------------------------------

  RollupTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-rollups'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------------
  # Publicacao do script do Glue Job
  #
  # O Git sync aplica o template, mas nao copia arquivos do repositorio para o
  # S3. Sem isto, o job apontaria para um objeto inexistente ate alguem rodar
  # um 'aws s3 cp' na mao -- e o trigger horario falharia nesse meio tempo.
  #
  # O conteudo vai numa propriedade do custom resource, nao no ZipFile da
  # funcao: inline Lambda tem teto de 4096 caracteres, propriedade nao. Como
  # efeito colateral util, editar o script muda a propriedade e o
  # CloudFormation reenvia o arquivo no proximo sync.
  # ---------------------------------------------------------------------------

  RollupScript:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt ScriptWriterFunction.Arn
      Bucket: !Ref DataBucket
      Key: scripts/rollup_job.py
      Content: |
        """
        Glue Job: le a tabela Iceberg de telemetria bruta, calcula rollups em tres
        granularidades e grava no DynamoDB para o frontend consumir.

        Cada bucket carrega min / max / avg / count. Media sozinha apaga o pico, que
        num grafico de sensor costuma ser exatamente o que interessa.

        A escrita e idempotente: o item e sobrescrito por (pk, sk), entao reprocessar
        a mesma janela produz o mesmo resultado. Isso permite rodar com lookback
        generoso para absorver dado que chegou atrasado.
        """

        import math
        import sys
        from datetime import datetime, timedelta, timezone
        from decimal import Decimal

        import boto3
        from awsglue.context import GlueContext
        from awsglue.job import Job
        from awsglue.utils import getResolvedOptions
        from pyspark.context import SparkContext
        from pyspark.sql import Window
        from pyspark.sql import functions as F
        from pyspark.sql.types import (
            ArrayType,
            DoubleType,
            StringType,
            StructField,
            StructType,
        )

        ARGS = getResolvedOptions(
            sys.argv,
            [
                "JOB_NAME",
                "glue_database",
                "source_table",
                "dynamo_table",
                "lookback_hours",
                "ttl_days",
                "positions_table",
                "sample_seconds",
            ],
        )

        LOOKBACK_HOURS = int(ARGS["lookback_hours"])
        TTL_DAYS = int(ARGS["ttl_days"])
        DYNAMO_TABLE = ARGS["dynamo_table"]
        SAMPLE_SECONDS = int(ARGS["sample_seconds"])

        # Precisao do geohash -> (rotulo, tamanho aproximado da celula).
        # p7 e a visao da fazenda; p9 e menor que a largura do implemento (6 a 12 m),
        # que e a condicao para sobreposicao aparecer no mapa.
        HEAT_GROSSA, HEAT_FINA = 7, 9

        # Um ponto sem sucessor, ou com sucessor muito distante no tempo, nao pode
        # arrastar horas de permanencia para a celula onde o trator estacionou.
        DT_MAXIMO = SAMPLE_SECONDS * 3

        # granularidade -> (expressao de truncamento, formato da chave, dias de TTL)
        # TTL curto no minuto e longo no dia: o grafico de range largo nunca pede
        # granularidade fina, entao guardar 1min por 45 dias so paga armazenamento.
        GRANULARITIES = {
            "1min": ("minute", "yyyy-MM-dd'T'HH:mm", 7),
            "1h": ("hour", "yyyy-MM-dd'T'HH", TTL_DAYS),
            "1d": ("day", "yyyy-MM-dd", TTL_DAYS * 8),
        }

        sc = SparkContext.getOrCreate()
        glue_context = GlueContext(sc)
        spark = glue_context.spark_session
        job = Job(glue_context)
        job.init(ARGS["JOB_NAME"], ARGS)

        source = f"glue_catalog.{ARGS['glue_database']}.{ARGS['source_table']}"
        cutoff = datetime.now(timezone.utc) - timedelta(hours=LOOKBACK_HOURS)

        raw = (
            spark.read.format("iceberg")
            .load(source)
            .filter(F.col("event_time") >= F.lit(cutoff))
        )

        # Deduplicacao na origem: retry de um lote HTTP reenvia os mesmos registros.
        # O exactly-once do Firehose garante entrega, nao ausencia de duplicata na
        # origem -- (batch_id, seq) e o que resolve isso.
        raw = raw.dropDuplicates(["device_id", "batch_id", "seq"])

        if raw.head(1):

            def rollup(granularity: str):
                trunc_unit, key_format, ttl_days = GRANULARITIES[granularity]
                bucket = F.date_trunc(trunc_unit, F.col("event_time"))
                expires = int(
                    (datetime.now(timezone.utc) + timedelta(days=ttl_days)).timestamp()
                )
                return (
                    raw.withColumn("bucket_start", bucket)
                    .groupBy("device_id", "metric", "bucket_start")
                    .agg(
                        F.min("value").alias("min_value"),
                        F.max("value").alias("max_value"),
                        F.avg("value").alias("avg_value"),
                        F.count("*").alias("sample_count"),
                        F.first("unit", ignorenulls=True).alias("unit"),
                    )
                    .select(
                        F.concat_ws("#", F.lit("DEV"), "device_id", "metric").alias("pk"),
                        F.concat_ws(
                            "#",
                            F.lit("AGG"),
                            F.lit(granularity),
                            F.date_format("bucket_start", key_format),
                        ).alias("sk"),
                        F.col("min_value"),
                        F.col("max_value"),
                        F.col("avg_value"),
                        F.col("sample_count"),
                        F.col("unit"),
                        F.date_format("bucket_start", "yyyy-MM-dd'T'HH:mm:ss'Z'").alias(
                            "bucket_start"
                        ),
                        F.lit(expires).alias("expires_at"),
                    )
                )

            def write_partition(rows):
                """Grava uma particao Spark no DynamoDB.

                batch_writer faz o chunking de 25 itens e reenvia UnprocessedItems
                automaticamente, com backoff.
                """
                table = boto3.resource("dynamodb").Table(DYNAMO_TABLE)
                with table.batch_writer(overwrite_by_pkeys=["pk", "sk"]) as batch:
                    for row in rows:
                        batch.put_item(
                            Item={
                                "pk": row["pk"],
                                "sk": row["sk"],
                                "bucket_start": row["bucket_start"],
                                "min": Decimal(str(round(row["min_value"], 6))),
                                "max": Decimal(str(round(row["max_value"], 6))),
                                "avg": Decimal(str(round(row["avg_value"], 6))),
                                "n": int(row["sample_count"]),
                                "unit": row["unit"] or "",
                                "expires_at": int(row["expires_at"]),
                            }
                        )

            def write_catalog():
                """Grava um item por (device, metrica) sob a particao CATALOG.

                Sem isto, listar os dispositivos exigiria um Scan da tabela. Com o
                item de catalogo, a API resolve a listagem com uma Query em
                pk = "CATALOG", que nao cresce com o historico -- so com a
                quantidade de series distintas.

                O TTL e renovado a cada execucao: um device que parar de reportar
                some da listagem sozinho depois de TTL_DAYS, sem nenhuma limpeza.
                """
                expires = int(
                    (datetime.now(timezone.utc) + timedelta(days=TTL_DAYS)).timestamp()
                )
                series = (
                    raw.groupBy("device_id", "metric")
                    .agg(
                        F.max("event_time").alias("last_seen"),
                        F.first("unit", ignorenulls=True).alias("unit"),
                    )
                    .collect()
                )
                table = boto3.resource("dynamodb").Table(DYNAMO_TABLE)
                with table.batch_writer(overwrite_by_pkeys=["pk", "sk"]) as batch:
                    for row in series:
                        batch.put_item(
                            Item={
                                "pk": "CATALOG",
                                "sk": f"DEV#{row['device_id']}#{row['metric']}",
                                "device_id": row["device_id"],
                                "metric": row["metric"],
                                "unit": row["unit"] or "",
                                "last_seen": row["last_seen"].strftime(
                                    "%Y-%m-%dT%H:%M:%SZ"
                                ),
                                "expires_at": expires,
                            }
                        )
                print(f"[rollup] catalogo: {len(series)} series")

            for granularity in GRANULARITIES:
                df = rollup(granularity)
                total = df.count()
                print(f"[rollup] {granularity}: {total} buckets")
                if total:
                    # Reparticiona para paralelizar a escrita sem estourar a
                    # particao quente do DynamoDB.
                    df.repartition(4).foreachPartition(write_partition)

            # Roda no driver: a cardinalidade e o numero de series, nao de linhas.
            write_catalog()
        else:
            print("[rollup] nenhum registro na janela; nada a fazer")


        # =============================================================================
        # Posicao (GPS dos tratores) -> heatmap por celula de geohash
        #
        # Aqui a agregacao certa nao e temporal, e espacial: quanto tempo o trator
        # permaneceu em cada pedaco de terreno. Geohash da isso com uma propriedade
        # util de graca -- celulas vizinhas compartilham prefixo, entao begins_with no
        # DynamoDB recorta uma regiao do mapa como between recorta um intervalo.
        #
        # O valor da celula e TEMPO, nao contagem de amostras. Contagem e enviesada
        # pela taxa de reporte: perda de sinal ou reporte adaptativo mentem no mapa.
        # =============================================================================

        BASE32 = "0123456789bcdefghjkmnpqrstuvwxyz"


        def geohash(lat, lon, precisao):
            """Codifica lat/lon em geohash. Sem dependencia: o Glue nao tem pacote extra.

            O prefixo e a propriedade que interessa aqui: celulas vizinhas no espaco
            compartilham prefixo, entao begins_with no DynamoDB recorta uma regiao do
            mapa do mesmo jeito que between recorta um intervalo de tempo.
            """
            lat_min, lat_max = -90.0, 90.0
            lon_min, lon_max = -180.0, 180.0
            codigo, bits, valor, par = [], 0, 0, True
            while len(codigo) < precisao:
                if par:
                    meio = (lon_min + lon_max) / 2
                    if lon >= meio:
                        valor = valor * 2 + 1
                        lon_min = meio
                    else:
                        valor = valor * 2
                        lon_max = meio
                else:
                    meio = (lat_min + lat_max) / 2
                    if lat >= meio:
                        valor = valor * 2 + 1
                        lat_min = meio
                    else:
                        valor = valor * 2
                        lat_max = meio
                par = not par
                bits += 1
                if bits == 5:
                    codigo.append(BASE32[valor])
                    bits, valor = 0, 0
            return "".join(codigo)


        def centro(codigo):
            """Devolve (lat, lon) do centro da celula e o tamanho dela em graus."""
            lat_min, lat_max = -90.0, 90.0
            lon_min, lon_max = -180.0, 180.0
            par = True
            for caractere in codigo:
                valor = BASE32.index(caractere)
                for deslocamento in (16, 8, 4, 2, 1):
                    bit = 1 if valor & deslocamento else 0
                    if par:
                        meio = (lon_min + lon_max) / 2
                        if bit:
                            lon_min = meio
                        else:
                            lon_max = meio
                    else:
                        meio = (lat_min + lat_max) / 2
                        if bit:
                            lat_min = meio
                        else:
                            lat_max = meio
                    par = not par
            return ((lat_min + lat_max) / 2, (lon_min + lon_max) / 2,
                    lat_max - lat_min, lon_max - lon_min)


        def metros_entre(lat_a, lon_a, lat_b, lon_b):
            raio = 6371000.0
            d_lat = math.radians(lat_b - lat_a)
            d_lon = math.radians(lon_b - lon_a)
            a = (
                math.sin(d_lat / 2) ** 2
                + math.cos(math.radians(lat_a))
                * math.cos(math.radians(lat_b))
                * math.sin(d_lon / 2) ** 2
            )
            return 2 * raio * math.asin(math.sqrt(a))


        def trecho_em_celulas(lat, lon, prox_lat, prox_lon, precisao, passo_m):
            """Distribui um trecho entre as celulas que ele CRUZA, com peso.

            Atribuir o trecho inteiro a celula do ponto inicial subestima cobertura
            sempre que o deslocamento entre fixes for maior que a celula -- e ele e:
            a 7 km/h com fix a cada 5 s o trator anda ~9,7 m, contra 4,8 m de celula
            fina. O heatmap sairia pontilhado, com buraco em toda celula pulada.

            A amostragem do segmento e aproximada, mas o erro fica limitado ao passo,
            e o resultado deixa de depender da taxa de reporte do device.
            """
            if prox_lat is None or prox_lon is None:
                return [(geohash(lat, lon, precisao), 1.0)]
            distancia = metros_entre(lat, lon, prox_lat, prox_lon)
            passos = max(1, min(200, int(distancia / passo_m) + 1))
            contagem = {}
            for i in range(passos):
                fracao = (i + 0.5) / passos
                codigo = geohash(
                    lat + (prox_lat - lat) * fracao,
                    lon + (prox_lon - lon) * fracao,
                    precisao,
                )
                contagem[codigo] = contagem.get(codigo, 0) + 1
            return [(codigo, n / passos) for codigo, n in contagem.items()]


        TRECHO = ArrayType(
            StructType([
                StructField("gh", StringType()),
                StructField("peso", DoubleType()),
            ])
        )
        trecho_udf = F.udf(trecho_em_celulas, TRECHO)
        centro_lat_udf = F.udf(lambda c: centro(c)[0], DoubleType())
        centro_lon_udf = F.udf(lambda c: centro(c)[1], DoubleType())

        # A janela de recomputacao do heatmap comeca no INICIO do dia mais antigo
        # alcancado pelo lookback, e nao no lookback em si. Motivo: o item da celula
        # acumula o dia inteiro e e sobrescrito por (pk, sk); recomputar so as ultimas
        # horas e sobrescrever apagaria a permanencia acumulada antes. Recomputando o
        # dia inteiro a escrita continua idempotente.
        heat_inicio = (datetime.now(timezone.utc) - timedelta(hours=LOOKBACK_HOURS)).replace(
            hour=0, minute=0, second=0, microsecond=0
        )

        posicoes = (
            spark.read.format("iceberg")
            .load(f"glue_catalog.{ARGS['glue_database']}.{ARGS['positions_table']}")
            .filter(F.col("event_time") >= F.lit(heat_inicio))
            .dropDuplicates(["device_id", "batch_id", "seq"])
        )

        if posicoes.head(1):
            ordem = Window.partitionBy("device_id").orderBy("event_time")

            passo = (
                posicoes.withColumn("prox_time", F.lead("event_time").over(ordem))
                .withColumn("prox_lat", F.lead("lat").over(ordem))
                .withColumn("prox_lon", F.lead("lon").over(ordem))
                # dt do ponto ate o proximo, limitado: sem o teto, um trator desligado
                # as 18h e religado as 6h doaria 12 h para a celula onde estacionou.
                .withColumn(
                    "dt",
                    F.least(
                        F.greatest(
                            F.coalesce(
                                F.unix_timestamp("prox_time") - F.unix_timestamp("event_time"),
                                F.lit(SAMPLE_SECONDS),
                            ),
                            F.lit(0),
                        ),
                        F.lit(DT_MAXIMO),
                    ),
                )
                # Haversine ate o proximo ponto. Distancia e dt saem do mesmo par, entao
                # velocidade = distancia / tempo fecha sem o device precisar informar.
                .withColumn(
                    "dist_m",
                    F.when(
                        F.col("prox_lat").isNull(), F.lit(0.0)
                    ).otherwise(
                        F.lit(2 * 6371000.0)
                        * F.asin(
                            F.sqrt(
                                F.pow(F.sin(F.radians(F.col("prox_lat") - F.col("lat")) / 2), 2)
                                + F.cos(F.radians(F.col("lat")))
                                * F.cos(F.radians(F.col("prox_lat")))
                                * F.pow(
                                    F.sin(F.radians(F.col("prox_lon") - F.col("lon")) / 2), 2
                                )
                            )
                        )
                    ),
                )
                .withColumn("dia", F.date_format("event_time", "yyyy-MM-dd"))
                # Passo de amostragem ~ metade da celula: fino o bastante para nao
                # pular celula, grosso o bastante para nao explodir o numero de passos.
                .withColumn(
                    "trechos_grossa",
                    trecho_udf("lat", "lon", "prox_lat", "prox_lon",
                               F.lit(HEAT_GROSSA), F.lit(70.0)),
                )
                .withColumn(
                    "trechos_fina",
                    trecho_udf("lat", "lon", "prox_lat", "prox_lon",
                               F.lit(HEAT_FINA), F.lit(2.0)),
                )
            )

            def celulas(coluna_trechos, chaves_extras=()):
                """Explode os trechos e agrega por celula, ponderando dt e distancia."""
                return (
                    passo.select(
                        "device_id", "dia", "dt", "dist_m",
                        F.explode(coluna_trechos).alias("trecho"),
                    )
                    .select(
                        "device_id", "dia",
                        F.col("trecho.gh").alias("gh"),
                        (F.col("dt") * F.col("trecho.peso")).alias("dt"),
                        (F.col("dist_m") * F.col("trecho.peso")).alias("dist_m"),
                        F.col("trecho.peso").alias("peso"),
                    )
                    .groupBy("device_id", "dia", "gh", *chaves_extras)
                    .agg(
                        F.sum("dt").alias("secs"),
                        F.sum("dist_m").alias("dist_m"),
                        # n conta fixes equivalentes, nao linhas: um fix dividido
                        # entre tres celulas contribui um terco para cada.
                        F.sum("peso").alias("n"),
                    )
                    .withColumn("cell_lat", centro_lat_udf(F.col("gh")))
                    .withColumn("cell_lon", centro_lon_udf(F.col("gh")))
                )

            def escreve_celulas(linhas, monta_chave, prefixo_sk, expira):
                table = boto3.resource("dynamodb").Table(DYNAMO_TABLE)
                with table.batch_writer(overwrite_by_pkeys=["pk", "sk"]) as batch:
                    for linha in linhas:
                        batch.put_item(
                            Item={
                                "pk": monta_chave(linha),
                                "sk": f"{prefixo_sk}#{linha['gh']}",
                                "gh": linha["gh"],
                                "lat": Decimal(str(round(linha["cell_lat"], 7))),
                                "lon": Decimal(str(round(linha["cell_lon"], 7))),
                                "secs": int(round(float(linha["secs"]))),
                                "dist_m": Decimal(str(round(float(linha["dist_m"]), 2))),
                                "n": int(round(float(linha["n"]))),
                                "expires_at": expira,
                            }
                        )

            expira_heat = int(
                (datetime.now(timezone.utc) + timedelta(days=TTL_DAYS * 8)).timestamp()
            )

            # Camada grossa: poucas celulas por dia, uma Query resolve a fazenda toda.
            grossa = celulas("trechos_grossa").collect()
            escreve_celulas(
                grossa,
                lambda l: f"HEAT#{l['device_id']}#{l['dia']}",
                f"GH{HEAT_GROSSA}",
                expira_heat,
            )

            # Camada fina: a particao e o PREFIXO da propria celula fina, entao as
            # duas camadas nao tem como divergir. O viewport do mapa diz quais pk
            # pedir, sem varrer o dia inteiro na resolucao de 5 m.
            fina = celulas("trechos_fina").withColumn(
                "gh_grossa", F.substring(F.col("gh"), 1, HEAT_GROSSA)
            )
            total_fina = fina.count()
            if total_fina:
                fina.repartition(4).foreachPartition(
                    lambda linhas: escreve_celulas(
                        linhas,
                        lambda l: f"HEAT#{l['device_id']}#{l['dia']}#{l['gh_grossa']}",
                        f"GH{HEAT_FINA}",
                        expira_heat,
                    )
                )

            # Ultima posicao conhecida: um item sobrescrito por device. E o que um mapa
            # ao vivo precisa, e sai de graca desta passagem.
            recentes = (
                posicoes.withColumn(
                    "ordem", F.row_number().over(
                        Window.partitionBy("device_id").orderBy(F.col("event_time").desc())
                    )
                )
                .filter(F.col("ordem") == 1)
                .collect()
            )
            table = boto3.resource("dynamodb").Table(DYNAMO_TABLE)
            with table.batch_writer(overwrite_by_pkeys=["pk", "sk"]) as batch:
                for linha in recentes:
                    visto = linha["event_time"].strftime("%Y-%m-%dT%H:%M:%SZ")
                    batch.put_item(
                        Item={
                            "pk": f"DEV#{linha['device_id']}#position",
                            "sk": "LATEST",
                            "lat": Decimal(str(round(float(linha["lat"]), 7))),
                            "lon": Decimal(str(round(float(linha["lon"]), 7))),
                            "at": visto,
                            "expires_at": expira_heat,
                        }
                    )
                    # Entrada de catalogo do device de posicao. O write_catalog da
                    # telemetria le so telemetry_raw, entao um trator que apenas
                    # reporta posicao nunca apareceria em /devices -- e o seletor do
                    # mapa ficaria vazio. "position" como metric tambem e o marcador
                    # que o frontend usa para separar serie de mapa.
                    batch.put_item(
                        Item={
                            "pk": "CATALOG",
                            "sk": f"DEV#{linha['device_id']}#position",
                            "device_id": linha["device_id"],
                            "metric": "position",
                            "unit": "",
                            "last_seen": visto,
                            "expires_at": expira_heat,
                        }
                    )

            print(
                f"[heatmap] p{HEAT_GROSSA}: {len(grossa)} celulas | "
                f"p{HEAT_FINA}: {total_fina} celulas | "
                f"{len(recentes)} posicoes atuais"
            )
        else:
            print("[heatmap] nenhuma posicao na janela; nada a fazer")

        job.commit()
  ScriptWriterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-script-writer'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ScriptWriterRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          s3 = boto3.client("s3")

          def handler(event, context):
              props = event["ResourceProperties"]
              bucket, key = props["Bucket"], props["Key"]
              uri = f"s3://{bucket}/{key}"
              try:
                  if event["RequestType"] == "Delete":
                      # O bucket de dados tem DeletionPolicy Retain, mas pode
                      # ter sido removido a mao. Falhar aqui travaria o delete
                      # da pilha.
                      try:
                          s3.delete_object(Bucket=bucket, Key=key)
                      except Exception:
                          pass
                  else:
                      extra = {}
                      for campo in ("ContentType", "CacheControl"):
                          if props.get(campo):
                              extra[campo] = props[campo]
                      s3.put_object(
                          Bucket=bucket,
                          Key=key,
                          Body=props["Content"].encode("utf-8"),
                          **extra,
                      )
                  cfnresponse.send(
                      event, context, cfnresponse.SUCCESS, {"Uri": uri}, uri
                  )
              except Exception as exc:
                  cfnresponse.send(
                      event, context, cfnresponse.FAILED, {"Erro": str(exc)}, uri
                  )
  ScriptWriterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: publica-script-do-job
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${DataBucket.Arn}/scripts/*'

  # ---------------------------------------------------------------------------
  # Glue Job - agregacao 1min / 1h / 1d
  # ---------------------------------------------------------------------------

  RollupJob:
    Type: AWS::Glue::Job
    DependsOn:
      - TelemetryRawTable
      - PositionsRawTable
    Properties:
      Name: !Sub '${ProjectName}-rollups'
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      MaxRetries: 1
      Timeout: 30
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Role: !GetAtt GlueJobRole.Arn
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !GetAtt RollupScript.Uri
      DefaultArguments:
        '--job-language': python
        '--datalake-formats': iceberg
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-observability-metrics': 'true'
        '--TempDir': !Sub 's3://${DataBucket}/tmp/'
        '--glue_database': !Ref GlueDatabase
        '--source_table': telemetry_raw
        '--positions_table': positions_raw
        '--sample_seconds': !Ref PositionSampleSeconds
        '--warehouse': !Sub 's3://${DataBucket}/warehouse/'
        '--dynamo_table': !Ref RollupTable
        '--lookback_hours': !Ref RollupLookbackHours
        '--ttl_days': !Ref HotStoreTtlDays
        '--conf': !Sub >-
          spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
          --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog
          --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
          --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
          --conf spark.sql.catalog.glue_catalog.warehouse=s3://${DataBucket}/warehouse/

  RollupSchedule:
    Type: AWS::Glue::Trigger
    Properties:
      Name: !Sub '${ProjectName}-rollup-schedule'
      Type: SCHEDULED
      Schedule: 'cron(5 * * * ? *)'
      StartOnCreation: true
      Actions:
        - JobName: !Ref RollupJob

  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSGlueServiceRole'
      Policies:
        - PolicyName: le-iceberg-escreve-dynamo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:UpdateTable
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabase}'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabase}/*'
              - Effect: Allow
                Action:
                  - dynamodb:BatchWriteItem
                  - dynamodb:PutItem
                  - dynamodb:DescribeTable
                Resource: !GetAtt RollupTable.Arn

  # ---------------------------------------------------------------------------
  # HTTP API - gateway compartilhado pelas rotas do argus
  #
  # As rotas, funcoes e o authorizer vivem em 75-argus-api.yaml. Aqui fica so
  # o chassi: api, stage com throttle e access log.
  # ---------------------------------------------------------------------------

  RollupApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-api'
      Description: Serie temporal de rollups para o frontend.
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref ApiCorsOrigin
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - content-type
        MaxAge: 300

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref RollupApi
      StageName: $default
      AutoDeploy: true
      # A tabela e PAY_PER_REQUEST: sem teto, um cliente em loop vira conta.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
        DetailedMetricsEnabled: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","rota":"$context.routeKey","status":"$context.status","erroIntegracao":"$context.integration.error","ms":"$context.responseLatency"}'

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${ProjectName}'
      RetentionInDays: 14

  # ---------------------------------------------------------------------------
  # API do argus - autenticacao, frota, localizacoes e usuarios
  #
  # O contrato e DEFINIDO por este backend, em openapi/openapi.yaml -- os
  # handlers implementam a spec, e clients (o argus-webapp) sao gerados dela.
  # ---------------------------------------------------------------------------

  # Uma UNICA policy para toda a frota, com variaveis de politica do IoT:
  # o certificado so conecta com o client id do proprio thing e so publica
  # nos topicos dele. Sem Subscribe nem Receive: o device e um emissor.
  DevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub '${ProjectName}-device'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}'
            Condition:
              Bool:
                iot:Connection.Thing.IsAttached: ['true']
          - Effect: Allow
            Action: iot:Publish
            Resource:
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/devices/${!iot:Connection.Thing.ThingName}/telemetry'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/devices/${!iot:Connection.Thing.ThingName}/position'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/rules/${TelemetryTopicRule}'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/rules/${PositionTopicRule}'

  # Sem autocadastro: usuario nasce por POST /api/users (ADMIN) ou pela CLI.
  # SEM DeletionPolicy Retain enquanto o ambiente e de desenvolvimento;
  # producao deve adicionar (usuarios sao estado).
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-users'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
      LambdaConfig:
        PreTokenGeneration: !GetAtt PreTokenFunction.Arn

  # Papeis que o webapp entende. O pre-token-generation transforma o grupo no
  # claim 'role' do ID token; o handler de usuarios impoe ADMIN na API.
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: ADMIN
  OperatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: OPERATOR
  ViewerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: VIEWER

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${ProjectName}-api'
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  PreTokenFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-pretoken'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt PreTokenRole.Arn
      Timeout: 5
      MemorySize: 128
      Code:
        ZipFile: |
          # Pre-token-generation do Cognito: injeta o claim 'role' no ID token a partir
          # do grupo do usuario. O webapp argus decide o que mostrar por esse claim
          # (decodeAccessClaims exige 'role' no payload).
          ORDEM = ("ADMIN", "OPERATOR", "VIEWER")


          def handler(event, context):
              grupos = (
                  event.get("request", {})
                  .get("groupConfiguration", {})
                  .get("groupsToOverride")
                  or []
              )
              # Usuario em mais de um grupo fica com o mais forte.
              papel = next((g for g in ORDEM if g in grupos), "VIEWER")
              event["response"] = {
                  "claimsOverrideDetails": {"claimsToAddOrOverride": {"role": papel}}
              }
              return event

  PreTokenRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  PreTokenInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PreTokenFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # JWT authorizer nativo: o gateway valida o token do Cognito sem invocar
  # Lambda. O accessToken devolvido pelo login e o ID TOKEN (aud = client id).
  ArgusAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref RollupApi
      # Nao pode chamar '${ProjectName}-cognito': o update cria o recurso novo
      # ANTES de deletar o FleetAuthorizer antigo, e nome de authorizer e
      # unico por API -- renomear o id logico exige nome fisico novo.
      Name: !Sub '${ProjectName}-argus-cognito'
      AuthorizerType: JWT
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

  # ---- funcoes ---------------------------------------------------------------

  AuthFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-argus-auth'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AuthRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          CLIENT_ID: !Ref UserPoolClient
      Code:
        ZipFile: |
          import json
          from datetime import datetime, timezone
          from http.client import responses
          import os

          import boto3

          idp = boto3.client("cognito-idp")
          CLIENT_ID = os.environ["CLIENT_ID"]


          def resp(status, corpo):
              return {"statusCode": status,
                      "headers": {"content-type": "application/json",
                                  "cache-control": "no-store"},
                      "body": json.dumps(corpo)}


          def erro(status, mensagem, caminho, campos=None):
              """Erro no formato ApiError da spec (openapi/openapi.yaml)."""
              return resp(status, {
                  "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "status": status, "error": responses.get(status, "Error"),
                  "message": mensagem, "path": caminho, "fields": campos or {}})


          def tokens(resultado, refresh_atual=None):
              """Molda a resposta no TokenResponse do contrato argus.

              O accessToken e o ID TOKEN do Cognito de proposito: e ele que carrega
              email, aud e o claim 'role' que o pre-token-generation injeta -- e o que
              o webapp decodifica. O access token do Cognito nao aceita claim custom
              sem feature plan pago.
              """
              r = resultado["AuthenticationResult"]
              return {
                  "accessToken": r["IdToken"],
                  # No refresh o Cognito nao devolve novo refresh token; o atual segue
                  # valendo ate expirar.
                  "refreshToken": r.get("RefreshToken") or refresh_atual,
                  "expiresIn": r["ExpiresIn"],
              }


          def handler(event, context):
              try:
                  corpo = json.loads(event.get("body") or "{}")
              except ValueError:
                  return erro(400, "body invalido", event.get("rawPath", ""))
              rota = event.get("routeKey", "")
              caminho = event.get("rawPath", rota)

              try:
                  if rota == "POST /v1/auth/login":
                      email = corpo.get("email") or ""
                      senha = corpo.get("password") or ""
                      if not email or not senha:
                          return erro(400, "email e password obrigatorios", caminho)
                      r = idp.initiate_auth(
                          ClientId=CLIENT_ID,
                          AuthFlow="USER_PASSWORD_AUTH",
                          AuthParameters={"USERNAME": email, "PASSWORD": senha},
                      )
                      if "AuthenticationResult" not in r:
                          # NEW_PASSWORD_REQUIRED etc.: fluxo de desafio nao suportado
                          # pela API; o operador finaliza o cadastro pela CLI.
                          return erro(409, f"desafio pendente: {r.get('ChallengeName')}", caminho)
                      return resp(200, tokens(r))

                  if rota == "POST /v1/auth/refresh":
                      atual = corpo.get("refreshToken") or ""
                      if not atual:
                          return erro(400, "refreshToken obrigatorio", caminho)
                      r = idp.initiate_auth(
                          ClientId=CLIENT_ID,
                          AuthFlow="REFRESH_TOKEN_AUTH",
                          AuthParameters={"REFRESH_TOKEN": atual},
                      )
                      return resp(200, tokens(r, refresh_atual=atual))
              except (idp.exceptions.NotAuthorizedException,
                      idp.exceptions.UserNotFoundException):
                  return erro(401, "credenciais invalidas", caminho)

              return erro(404, "rota desconhecida", caminho)

  AuthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: autentica
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cognito-idp:InitiateAuth
                Resource: !GetAtt UserPool.Arn

  DevicesReadFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-argus-devices-read'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DevicesReadRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref RollupTable
      Code:
        ZipFile: |
          import json
          from datetime import datetime, timezone
          from http.client import responses
          import os

          import boto3
          from boto3.dynamodb.conditions import Key

          TABELA = boto3.resource("dynamodb").Table(os.environ["TABLE"])


          def resp(status, corpo):
              return {"statusCode": status,
                      "headers": {"content-type": "application/json",
                                  "cache-control": "no-store"},
                      "body": json.dumps(corpo)}


          def erro(status, mensagem, caminho, campos=None):
              """Erro no formato ApiError da spec (openapi/openapi.yaml)."""
              return resp(status, {
                  "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "status": status, "error": responses.get(status, "Error"),
                  "message": mensagem, "path": caminho, "fields": campos or {}})


          def molda(item):
              """Item DEVICEMETA -> DeviceResponse do contrato argus."""
              return {
                  "id": item["sk"],
                  "code": item["sk"],
                  "label": item.get("label") or "",
                  "createdAt": item.get("created_at"),
                  "revokedAt": item.get("revoked_at"),
                  "active": bool(item.get("active")),
              }


          def handler(event, context):
              rota = event.get("routeKey", "")
              caminho_url = event.get("rawPath", rota)
              caminho = event.get("pathParameters") or {}

              if rota == "GET /v1/devices":
                  # Metadados numa particao unica: listar e uma Query, nao um Scan nem
                  # N chamadas ao IoT. A particao cresce com a frota, nao com o dado.
                  itens, proxima = [], None
                  while True:
                      extra = {"ExclusiveStartKey": proxima} if proxima else {}
                      pagina = TABELA.query(
                          KeyConditionExpression=Key("pk").eq("DEVICEMETA"), **extra
                      )
                      itens += pagina["Items"]
                      proxima = pagina.get("LastEvaluatedKey")
                      if not proxima:
                          break
                  return resp(200, [molda(i) for i in itens])

              if rota == "GET /v1/devices/{code}":
                  codigo = caminho.get("code")
                  r = TABELA.get_item(Key={"pk": "DEVICEMETA", "sk": codigo})
                  if "Item" not in r:
                      return erro(404, f"device {codigo} nao existe", caminho_url)
                  return resp(200, molda(r["Item"]))

              return erro(404, "rota desconhecida", caminho_url)

  DevicesReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: le-frota
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                Resource: !GetAtt RollupTable.Arn

  DevicesWriteFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-argus-devices-write'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DevicesWriteRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref RollupTable
          DEVICE_POLICY: !Ref DevicePolicy
      Code:
        ZipFile: |
          import json
          import os
          import re
          from datetime import datetime, timezone
          from http.client import responses

          import boto3

          iot = boto3.client("iot")
          TABELA = boto3.resource("dynamodb").Table(os.environ["TABLE"])
          POLICY = os.environ["DEVICE_POLICY"]
          COD_OK = re.compile(r"^[a-zA-Z0-9_-]{1,128}$")


          def resp(status, corpo):
              return {"statusCode": status,
                      "headers": {"content-type": "application/json",
                                  "cache-control": "no-store"},
                      "body": json.dumps(corpo)}


          def erro(status, mensagem, caminho, campos=None):
              return resp(status, {
                  "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "status": status, "error": responses.get(status, "Error"),
                  "message": mensagem, "path": caminho, "fields": campos or {}})


          def agora():
              return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")


          def molda(i):
              return {"id": i["sk"], "code": i["sk"], "label": i.get("label") or "",
                      "createdAt": i.get("created_at"),
                      "revokedAt": i.get("revoked_at"), "active": bool(i.get("active"))}


          def handler(event, context):
              rota = event.get("routeKey", "")
              caminho_url = event.get("rawPath", rota)
              caminho = event.get("pathParameters") or {}
              codigo = caminho.get("code")
              try:
                  corpo = json.loads(event.get("body") or "{}")
              except ValueError:
                  return erro(400, "body invalido", event.get("rawPath", ""))

              if rota == "POST /v1/devices":
                  codigo = corpo.get("code") or ""
                  rotulo = (corpo.get("label") or "").strip()
                  if not COD_OK.match(codigo):
                      return erro(400, "code invalido", caminho_url,
                                  {"code": "[a-zA-Z0-9_-]{1,128}"})
                  if not rotulo:
                      return erro(400, "label obrigatorio", caminho_url,
                                  {"label": "obrigatorio"})
                  try:
                      iot.create_thing(thingName=codigo)
                  except iot.exceptions.ResourceAlreadyExistsException:
                      return erro(409, f"device {codigo} ja existe", caminho_url)
                  cert = iot.create_keys_and_certificate(setAsActive=True)
                  iot.attach_policy(policyName=POLICY, target=cert["certificateArn"])
                  iot.attach_thing_principal(
                      thingName=codigo, principal=cert["certificateArn"]
                  )
                  # Label no DynamoDB: atributo de thing nao aceita espaco.
                  item = {"pk": "DEVICEMETA", "sk": codigo, "label": rotulo,
                          "created_at": agora(), "revoked_at": None, "active": True}
                  TABELA.put_item(Item=item)
                  ep = iot.describe_endpoint(
                      endpointType="iot:Data-ATS"
                  )["endpointAddress"]
                  # Mostradas UMA vez: a chave privada nao fica armazenada.
                  return resp(201, {"device": molda(item), "credentials": {
                      "privateKeyPem": cert["keyPair"]["PrivateKey"],
                      "certificatePem": cert["certificatePem"],
                      "mqttEndpoint": ep,
                      "clientId": codigo,
                      "topics": {"telemetry": f"devices/{codigo}/telemetry",
                                 "position": f"devices/{codigo}/position"}}})

              if rota == "DELETE /v1/devices/{code}/credentials":
                  r = TABELA.get_item(Key={"pk": "DEVICEMETA", "sk": codigo})
                  if "Item" not in r:
                      return erro(404, f"device {codigo} nao existe", caminho_url)
                  try:
                      arns = iot.list_thing_principals(thingName=codigo)["principals"]
                  except iot.exceptions.ResourceNotFoundException:
                      arns = []
                  for arn in arns:
                      cid = arn.split("/")[-1]
                      # Desativa primeiro: derruba a conexao mesmo se algo falhar.
                      iot.update_certificate(certificateId=cid, newStatus="INACTIVE")
                      iot.detach_policy(policyName=POLICY, target=arn)
                      iot.detach_thing_principal(thingName=codigo, principal=arn)
                      iot.delete_certificate(certificateId=cid)
                  item = dict(r["Item"], revoked_at=agora(), active=False)
                  TABELA.put_item(Item=item)
                  return resp(200, molda(item))

              return erro(404, "rota desconhecida", caminho_url)

  DevicesWriteRole:
    Type: AWS::IAM::Role
