  # ---------------------------------------------------------------------------
  # Frontend estatico - bucket privado + CloudFront
  #
  # O bucket nao e publico: quem le e a distribuicao, via Origin Access
  # Control. Alem de evitar bucket aberto, isso da HTTPS -- o endpoint de
  # website do S3 serve so em HTTP -- e e o CloudFront na frente que aproveita
  # o Cache-Control longo que a API devolve para janela ja fechada.
  # ---------------------------------------------------------------------------

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-site-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-site-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${ProjectName} - dashboard de telemetria'
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        # PriceClass_All porque as classes menores nao incluem a America do
        # Sul; com 100 ou 200 o acesso daqui sairia de outro continente.
        PriceClass: PriceClass_All
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized: honra o Cache-Control da origem.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  FrontendIndex:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt ScriptWriterFunction.Arn
      Bucket: !Ref SiteBucket
      Key: index.html
      ContentType: 'text/html; charset=utf-8'
      # Curto de proposito: o CloudFront revalida em vez de servir uma versao
      # velha da pagina depois de um deploy, sem precisar de invalidacao.
      CacheControl: 'public, max-age=60'
      Content: |
        {{ include: frontend/index.html }}
  # A URL da API entra aqui, e nao dentro do HTML, para o index.html do
  # repositorio ser identico ao publicado -- o que permite a checagem de
  # divergencia em scripts/check_embedded_script.py.
  FrontendConfig:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt ScriptWriterFunction.Arn
      Bucket: !Ref SiteBucket
      Key: config.json
      ContentType: application/json
      CacheControl: 'public, max-age=60'
      Content: !Sub '{"apiBase": "${RollupApi.ApiEndpoint}"}'
