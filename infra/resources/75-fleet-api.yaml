  # ---------------------------------------------------------------------------
  # Gestao da frota - provisionamento no IoT Core via API, com Cognito
  #
  # Uma UNICA policy para toda a frota, com variaveis de politica do IoT:
  # ${iot:Connection.Thing.ThingName} resolve para o thing anexado ao
  # certificado na conexao. O certificado do trator-07 so conecta como
  # trator-07 e so publica nos topicos do trator-07 -- sem uma policy por
  # device para gerenciar, e sem como um device publicar no lugar de outro.
  #
  # Privilegio minimo de verdade: nao ha Subscribe nem Receive. O device desta
  # pilha e um emissor de telemetria; se um dia precisar receber comando, a
  # permissao nasce ai, nao antes.
  # ---------------------------------------------------------------------------

  DevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub '${ProjectName}-device'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}'
            Condition:
              Bool:
                iot:Connection.Thing.IsAttached: ['true']
          - Effect: Allow
            Action: iot:Publish
            Resource:
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/devices/${!iot:Connection.Thing.ThingName}/telemetry'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/devices/${!iot:Connection.Thing.ThingName}/position'
              # Basic ingest: publicar direto no Rules Engine pula o broker e
              # a cobranca de mensageria. O conteudo continua carregando o
              # device_id, e a chave e o certificado continuam por device.
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/rules/${TelemetryTopicRule}'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/rules/${PositionTopicRule}'

  # Leitura da frota: listar e inspecionar devices e certificados.
  # (Rotas protegidas pelo JWT do Cognito -- ver FleetAuthorizer.)
  FleetReadFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-fleet-read'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FleetReadRole.Arn
      Timeout: 15
      MemorySize: 256
      Code:
        ZipFile: |
          {{ include: lambdas/fleet_devices_read.py }}

  # Escrita: criar device + certificado, rotacionar, ativar/desativar, revogar.
  FleetWriteFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-fleet-write'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FleetWriteRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          DEVICE_POLICY: !Ref DevicePolicy
      Code:
        ZipFile: |
          {{ include: lambdas/fleet_devices_write.py }}

  # Quem gere a frota e um usuario do Cognito, nao uma chave compartilhada.
  # Sem autocadastro: usuario nasce por admin-create-user, nunca sozinho.
  # SEM DeletionPolicy Retain de proposito: usuarios morrem com a pilha. Antes
  # de valer em producao, adicione Retain -- e lembre da danca do
  # ResourceExistenceCheck ao recriar (ver secao de recursos retidos).
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-users'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${ProjectName}-api'
      # Sem secret: o mesmo client serve CLI hoje e um frontend depois.
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  FleetReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: le-frota
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iot:ListThings
                  - iot:DescribeEndpoint
                Resource: '*'
              - Effect: Allow
                Action:
                  - iot:DescribeThing
                  - iot:ListThingPrincipals
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/*'
              - Effect: Allow
                Action: iot:DescribeCertificate
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:cert/*'

  FleetWriteRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: provisiona-frota
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CreateKeysAndCertificate e DescribeEndpoint nao aceitam
              # escopo de recurso.
              - Effect: Allow
                Action:
                  - iot:CreateKeysAndCertificate
                  - iot:DescribeEndpoint
                Resource: '*'
              - Effect: Allow
                Action:
                  - iot:CreateThing
                  - iot:DescribeThing
                  - iot:DeleteThing
                  - iot:AttachThingPrincipal
                  - iot:DetachThingPrincipal
                  - iot:ListThingPrincipals
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/*'
              - Effect: Allow
                Action:
                  - iot:DescribeCertificate
                  - iot:UpdateCertificate
                  - iot:DeleteCertificate
                  - iot:AttachPolicy
                  - iot:DetachPolicy
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:cert/*'
              # AttachPolicy/DetachPolicy validam tambem a policy alvo.
              - Effect: Allow
                Action:
                  - iot:AttachPolicy
                  - iot:DetachPolicy
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:policy/${DevicePolicy}'

  # JWT authorizer nativo do HTTP API: o gateway valida o token do Cognito
  # (assinatura, expiracao, audience) sem invocar Lambda nenhuma. Requisicao
  # sem token nem toca o codigo de negocio.
  FleetAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref RollupApi
      Name: !Sub '${ProjectName}-cognito'
      AuthorizerType: JWT
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

  FleetReadIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RollupApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FleetReadFunction.Arn
      PayloadFormatVersion: '2.0'

  FleetWriteIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RollupApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FleetWriteFunction.Arn
      PayloadFormatVersion: '2.0'

  FleetListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'GET /fleet/devices'
      AuthorizationType: JWT
      AuthorizerId: !Ref FleetAuthorizer
      Target: !Sub 'integrations/${FleetReadIntegration}'

  FleetDetailRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'GET /fleet/devices/{device_id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref FleetAuthorizer
      Target: !Sub 'integrations/${FleetReadIntegration}'

  FleetCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'POST /fleet/devices'
      AuthorizationType: JWT
      AuthorizerId: !Ref FleetAuthorizer
      Target: !Sub 'integrations/${FleetWriteIntegration}'

  FleetRotateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'POST /fleet/devices/{device_id}/certificates'
      AuthorizationType: JWT
      AuthorizerId: !Ref FleetAuthorizer
      Target: !Sub 'integrations/${FleetWriteIntegration}'

  FleetCertStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'PATCH /fleet/devices/{device_id}/certificates/{certificate_id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref FleetAuthorizer
      Target: !Sub 'integrations/${FleetWriteIntegration}'

  FleetRevokeCertRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'DELETE /fleet/devices/{device_id}/certificates/{certificate_id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref FleetAuthorizer
      Target: !Sub 'integrations/${FleetWriteIntegration}'

  FleetDeleteDeviceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RollupApi
      RouteKey: 'DELETE /fleet/devices/{device_id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref FleetAuthorizer
      Target: !Sub 'integrations/${FleetWriteIntegration}'

  FleetReadInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FleetReadFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RollupApi}/*'

  FleetWriteInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FleetWriteFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RollupApi}/*'
