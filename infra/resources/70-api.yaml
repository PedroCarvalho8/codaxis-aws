  # ---------------------------------------------------------------------------
  # HTTP API - gateway compartilhado pelas rotas do argus
  #
  # As rotas, funcoes e o authorizer vivem em 75-argus-api.yaml. Aqui fica so
  # o chassi: api, stage com throttle e access log.
  # ---------------------------------------------------------------------------

  RollupApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-api'
      Description: Serie temporal de rollups para o frontend.
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref ApiCorsOrigin
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - content-type
        MaxAge: 300

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref RollupApi
      StageName: $default
      AutoDeploy: true
      # A tabela e PAY_PER_REQUEST: sem teto, um cliente em loop vira conta.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
        DetailedMetricsEnabled: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","rota":"$context.routeKey","status":"$context.status","erroIntegracao":"$context.integration.error","ms":"$context.responseLatency"}'

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${ProjectName}'
      RetentionInDays: 14
